# cargo-about (https://embarkstudios.github.io/cargo-about/) writes the license
# texts of every crate compiled into truss, which the release attaches as
# truss-<tag>-THIRD_PARTY_LICENSES.html and copies into the container image. The
# accepted list is deny.toml's allow list: cargo deny decides what may be
# linked, this ships the texts of what is.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]

# The platforms release.yml ships (.github/release-targets.json).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

ignore-dev-dependencies = true
ignore-build-dependencies = false


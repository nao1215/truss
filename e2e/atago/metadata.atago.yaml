# Metadata retention through the encoders, focused on lossy WebP.
#
# Regression coverage for https://github.com/nao1215/truss/issues/279:
# `truss optimize --format webp --mode lossy` failed with exit 4 ("lossy WebP
# optimization cannot preserve metadata") on every ICC-bearing input, and no flag
# combination avoided it — a strip request is upgraded to "preserve ICC" for lossy
# output, which is exactly the state the encoder rejected. libwebp still cannot embed
# metadata, so truss now writes the ICCP/EXIF/XMP chunks into the container itself.
#
# `${fixtures}/icc-profile.jpg` is a 64x64 JPEG carrying a 588-byte sRGB profile and
# no EXIF, which is the shape of input that used to fail. Chunk four-character codes are
# ASCII, so `file: contains:` reads them straight out of the binary; the `image`
# assertion decodes the rewritten container for real. Run with: e2e/run.sh
version: "1"

suite:
  name: truss metadata retention

scenarios:
  - name: dropping an EXIF orientation with the pixels as stored warns
    steps:
      # --no-auto-orient leaves the pixels as the file stores them, and the default
      # --strip-metadata removes the tag that says how to display them. Each flag is
      # honest on its own; together they rotate the picture, and that has to be said.
      - run:
          command: truss convert "${fixtures}/exif-rotated.jpg" -o rotated.png --no-auto-orient
      - assert:
          exit_code: 0
          stderr:
            contains:
              - "warning:"
              - "EXIF orientation 6"
      - assert:
          image:
            path: rotated.png
            width: 40
            height: 20

  - name: keeping the metadata keeps the tag, so nothing is warned about
    steps:
      - run:
          command: truss convert "${fixtures}/exif-rotated.jpg" -o kept.jpg --no-auto-orient --keep-metadata
      - assert:
          exit_code: 0
          stderr:
            not_contains: "warning:"
      - run:
          command: truss inspect kept.jpg
      - assert:
          exit_code: 0
          stdout:
            json:
              path: $.orientation
              equals: 6

  - name: applying the orientation is not a drop, so nothing is warned about
    steps:
      - run:
          command: truss convert "${fixtures}/exif-rotated.jpg" -o applied.png
      - assert:
          exit_code: 0
          stderr:
            not_contains: "warning:"
          image:
            path: applied.png
            width: 20
            height: 40

  - name: the tag is honoured in every container that can carry it
    steps:
      # PNG keeps it in an eXIf chunk, WebP in an EXIF chunk, and every browser applies it
      # in both, so which container a photo arrives in must not decide whether the picture
      # comes out upright. The three fixtures are the same 40x20 picture with the same tag.
      - run:
          command: truss inspect "${fixtures}/exif-rotated.png"
      - assert:
          exit_code: 0
          stdout:
            json:
              path: $.orientation
              equals: 6
      - assert:
          stdout:
            json:
              path: $.orientedWidth
              equals: 20
      - assert:
          stdout:
            json:
              path: $.orientedHeight
              equals: 40
      - run:
          command: truss convert "${fixtures}/exif-rotated.png" -o png-applied.png
      - assert:
          exit_code: 0
          image:
            path: png-applied.png
            width: 20
            height: 40
      - run:
          command: truss inspect "${fixtures}/exif-rotated.webp"
      - assert:
          exit_code: 0
          stdout:
            json:
              path: $.orientation
              equals: 6
      - run:
          command: truss convert "${fixtures}/exif-rotated.webp" -o webp-applied.png
      - assert:
          exit_code: 0
          image:
            path: webp-applied.png
            width: 20
            height: 40

  - name: an AVIF signals the same transform as item properties, and those are honoured too
    steps:
      # AVIF has no EXIF orientation of its own: the encoder writes irot and imir item
      # properties instead, and browsers apply those. Both fixtures come from libheif, the
      # encoder behind ImageMagick, and carry no Exif block at all. The transposed one is
      # the same picture as exif-transposed-5.jpg, so the same baseline tells 5 from 7.
      - run:
          command: truss inspect "${fixtures}/irot-rotated.avif"
      - assert:
          exit_code: 0
          stdout:
            json:
              - path: $.orientation
                equals: 6
              - path: $.orientedWidth
                equals: 20
              - path: $.orientedHeight
                equals: 40
      - run:
          command: truss convert "${fixtures}/irot-rotated.avif" -o avif-applied.png
      - assert:
          exit_code: 0
          stderr:
            not_contains: "warning:"
          image:
            path: avif-applied.png
            width: 20
            height: 40
      - run:
          command: truss convert "${fixtures}/imir-transposed-5.avif" -o avif5.png
      - assert:
          exit_code: 0
          image:
            path: avif5.png
            width: 20
            height: 40
      - assert:
          image:
            path: avif5.png
            similar_to: testdata/exif-orientation-5.png
            max_diff: 0.01
      - run:
          command: truss convert "${fixtures}/irot-rotated.avif" -o avif-unturned.png --no-auto-orient
      - assert:
          exit_code: 0
          stderr:
            contains:
              - "warning:"
              - "EXIF orientation 6"
          image:
            path: avif-unturned.png
            width: 40
            height: 20

  - name: dropping a PNG orientation with the pixels as stored warns like a JPEG does
    steps:
      - run:
          command: truss convert "${fixtures}/exif-rotated.png" -o unturned.png --no-auto-orient
      - assert:
          exit_code: 0
          stderr:
            contains:
              - "warning:"
              - "EXIF orientation 6"
          image:
            path: unturned.png
            width: 40
            height: 20

  - name: an input with no orientation to drop does not warn
    steps:
      - run:
          command: truss convert "${fixtures}/sample.jpg" -o plain.png --no-auto-orient
      - assert:
          exit_code: 0
          stderr:
            not_contains: "warning:"

  - name: lossy WebP optimization succeeds on ICC-bearing input and keeps the profile
    steps:
      - run:
          command: truss optimize "${fixtures}/icc-profile.jpg" -o out.webp --format webp --mode lossy
      - assert:
          exit_code: 0
          # A valid extended-format WebP that decoders can still read.
          image:
            path: out.webp
            format: webp
            width: 64
            height: 64
      - assert:
          file:
            path: out.webp
            contains:
              - "VP8X"
              - "ICCP"

  - name: --strip-metadata is never the reason the command fails
    steps:
      - run:
          command: truss optimize "${fixtures}/icc-profile.jpg" -o strip.webp --format webp --mode lossy --strip-metadata
      - assert:
          exit_code: 0
          image:
            path: strip.webp
            format: webp
            width: 64
            height: 64

  - name: --keep-metadata keeps the ICC profile in lossy WebP output
    steps:
      - run:
          command: truss optimize "${fixtures}/icc-profile.jpg" -o keep.webp --format webp --mode lossy --keep-metadata
      - assert:
          exit_code: 0
          file:
            path: keep.webp
            contains: "ICCP"

  - name: --preserve-exif drops the ICC profile as asked
    steps:
      - run:
          command: truss optimize "${fixtures}/icc-profile.jpg" -o exif.webp --format webp --mode lossy --preserve-exif
      - assert:
          exit_code: 0
          image:
            path: exif.webp
            format: webp
            width: 64
      - assert:
          file:
            path: exif.webp
            not_contains: "ICCP"

  - name: a target-quality lossy run works on ICC-bearing input
    steps:
      # The real-world command from the issue report.
      - run:
          command: truss optimize "${fixtures}/icc-profile.jpg" -o target.webp --format webp --mode lossy --target-quality ssim:0.995
      - assert:
          exit_code: 0
          image:
            path: target.webp
            format: webp
            width: 64
            height: 64

  - name: optimize and convert agree on ICC-bearing input
    steps:
      - run:
          command: truss convert "${fixtures}/icc-profile.jpg" -o conv.webp --format webp --quality 80
      - assert:
          exit_code: 0
          image:
            path: conv.webp
            format: webp
            width: 64
      - run:
          command: truss optimize "${fixtures}/icc-profile.jpg" -o opt.webp --format webp --mode lossy
      - assert:
          exit_code: 0
          image:
            path: opt.webp
            format: webp
            width: 64

  - name: --mode auto still succeeds on ICC-bearing input
    steps:
      - run:
          command: truss optimize "${fixtures}/icc-profile.jpg" -o auto.webp --format webp --mode auto
      - assert:
          exit_code: 0
          image:
            path: auto.webp
            format: webp
            width: 64

  - name: input without an ICC profile is unaffected
    steps:
      - run:
          command: truss optimize "${fixtures}/sample.jpg" -o noicc.webp --format webp --mode lossy
      - assert:
          exit_code: 0
          image:
            path: noicc.webp
            format: webp
      - assert:
          file:
            path: noicc.webp
            not_contains: "ICCP"

  - name: the ICC profile survives a JPEG to lossy WebP and back round trip
    steps:
      - run:
          command: truss optimize "${fixtures}/icc-profile.jpg" -o rt.webp --format webp --mode lossy --keep-metadata
      - assert:
          exit_code: 0
      - run:
          command: truss convert rt.webp -o rt.jpg --format jpeg --keep-metadata
      - assert:
          exit_code: 0
          image:
            path: rt.jpg
            format: jpeg
            width: 64
            height: 64
      - assert:
          # JPEG carries the profile in an APP2 segment tagged "ICC_PROFILE".
          file:
            path: rt.jpg
            contains: "ICC_PROFILE"

  - name: a transparent input keeps both its alpha and its ICC profile
    steps:
      # libwebp emits an extended container (VP8X + ALPH) for a transparent image, so the
      # profile must be added to that header rather than replacing it.
      - run:
          command: truss convert "${fixtures}/transparent.png" -o alpha.webp --format webp --quality 80 --keep-metadata
      - assert:
          exit_code: 0
          image:
            path: alpha.webp
            format: webp
            alpha: true
      - run:
          command: truss inspect alpha.webp
      - assert:
          exit_code: 0
          stdout:
            json:
              path: $.hasAlpha
              equals: true

  - name: lossless WebP output keeps the ICC profile too
    steps:
      - run:
          command: truss convert "${fixtures}/icc-profile.jpg" -o lossless.webp --format webp --keep-metadata
      - assert:
          exit_code: 0
          image:
            path: lossless.webp
            format: webp
            width: 64
            height: 64
      - assert:
          file:
            path: lossless.webp
            contains: "ICCP"

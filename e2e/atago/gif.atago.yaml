# GIF input coverage for https://github.com/nao1215/truss/issues/301.
#
# GIF is a decode-only format here: truss reads it and writes one of the formats it can
# encode. That asymmetry is the whole contract, so these scenarios pin both halves —
# what a GIF input is allowed to do, and every way GIF output is refused.
#
# The animated case is the one worth being strict about. Taking frame one and exiting 0
# would hand a caller a still image with no signal that the animation was discarded, so
# convert refuses while inspect still reports the file honestly.
#
# Run with: e2e/run.sh --filter gif
version: "1"

suite:
  name: truss gif input

scenarios:
  - name: inspect reports a static GIF87a
    steps:
      - run:
          command: truss inspect "${fixtures}/sample.gif"
      - assert:
          exit_code: 0
          stdout:
            json:
              - path: $.format
                equals: gif
              - path: $.mime
                equals: image/gif
              - path: $.width
                equals: 4
              - path: $.height
                equals: 3
              - path: $.isAnimated
                equals: false

  - name: inspect reports GIF transparency
    steps:
      - run:
          command: truss inspect "${fixtures}/transparent.gif"
      - assert:
          exit_code: 0
          stdout:
            json:
              - path: $.format
                equals: gif
              - path: $.hasAlpha
                equals: true

  - name: inspect reads an animated GIF instead of refusing it
    steps:
      # inspect is how a caller finds out an upload is animated before deciding what to
      # do with it, so it has to succeed on exactly the file convert will refuse.
      - run:
          command: truss inspect "${fixtures}/animated.gif"
      - assert:
          exit_code: 0
          stdout:
            json:
              - path: $.format
                equals: gif
              - path: $.isAnimated
                equals: true

  - name: converts a static GIF to PNG
    steps:
      - run:
          command: truss convert "${fixtures}/sample.gif" -o out.png
      - assert:
          exit_code: 0
          image:
            path: out.png
            format: png
            width: 4
            height: 3

  - name: converts a static GIF to JPEG and WebP
    steps:
      - run:
          command: truss convert "${fixtures}/sample.gif" -o out.jpg
      - assert:
          exit_code: 0
          image:
            path: out.jpg
            format: jpeg
      - run:
          command: truss convert "${fixtures}/sample.gif" -o out.webp --format webp
      - assert:
          exit_code: 0
          image:
            path: out.webp
            format: webp

  - name: a GIF resizes like any other raster input
    steps:
      - run:
          command: truss convert "${fixtures}/sample.gif" -o small.png --width 2
      - assert:
          exit_code: 0
          image:
            path: small.png
            format: png
            width: 2

  - name: GIF transparency survives conversion to PNG
    steps:
      - run:
          command: truss convert "${fixtures}/transparent.gif" -o alpha.png
      - assert:
          exit_code: 0
          image:
            path: alpha.png
            format: png
            alpha: true
      - run:
          command: truss inspect alpha.png
      - assert:
          exit_code: 0
          stdout:
            json:
              path: $.hasAlpha
              equals: true

  - name: a GIF with no output format hint falls back to PNG, not GIF
    steps:
      # Writing to stdout gives no extension to infer from. "Keep the input format" would
      # mean GIF, which truss cannot encode, so the default has to be something else.
      - run:
          command: truss convert "${fixtures}/sample.gif" -o -
          stdout_to: piped.out
      - assert:
          exit_code: 0
          image:
            path: piped.out
            format: png

  - name: "converting an animated GIF fails with exit 3 and names the frame count"
    steps:
      - run:
          command: truss convert "${fixtures}/animated.gif" -o animated.png
      - assert:
          exit_code: 3
          stderr:
            contains:
              - "animated GIF is not supported"
              - "3 frames"

  - name: optimize also refuses an animated GIF
    steps:
      - run:
          command: truss optimize "${fixtures}/animated.gif" -o animated.png --format png
      - assert:
          exit_code: 3
          stderr:
            contains: "animated GIF is not supported"

  - name: "--format gif is rejected at the flag, with exit 1"
    steps:
      # Catching this at parse time puts the error next to what the user typed instead of
      # surfacing it from deep in the pipeline.
      - run:
          command: truss convert "${fixtures}/sample.png" -o out.png --format gif
      - assert:
          exit_code: 1
          stderr:
            contains:
              - "input-only format"
              - "png, jpeg, webp, or avif"

  - name: a .gif output extension is rejected the same way the flag is
    steps:
      # `--format gif` and `-o out.gif` ask for the same impossible thing, so they are
      # the same usage error with the same wording. This used to surface from deep in
      # the pipeline as exit 4 and "unsupported output media type: image/gif".
      - run:
          command: truss convert "${fixtures}/sample.png" -o out.gif
      - assert:
          exit_code: 1
          stderr:
            contains:
              - "input-only format"
              - "png, jpeg, webp, or avif"

  - name: an explicit --format overrides a .gif output extension
    steps:
      - run:
          command: truss convert "${fixtures}/sample.png" -o out.gif --format png
      - assert:
          exit_code: 0
          image:
            path: out.gif
            format: png

  - name: a GIF round-trips through PNG back to the same pixels
    steps:
      # GIF decodes to exact palette colors and PNG stores them losslessly, so two
      # different routes to PNG must agree to the pixel.
      - run:
          command: truss convert "${fixtures}/sample.gif" -o direct.png
      - assert:
          exit_code: 0
      - run:
          command: truss convert "${fixtures}/sample.gif" -o intermediate.bmp
      - assert:
          exit_code: 0
      - run:
          command: truss convert intermediate.bmp -o roundtrip.png
      - assert:
          exit_code: 0
          image:
            path: roundtrip.png
            similar_to: direct.png

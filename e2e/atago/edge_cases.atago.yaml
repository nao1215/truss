# Migrated from ShellSpec integration/cli/spec/edge_cases_spec.sh.
# Real-world image processing must handle broken, unusual, and adversarial
# inputs gracefully: dimension extremes, transparency, EXIF rotation, CMYK,
# truncated/corrupted files, and non-image data.
#
# Fixture overview (integration/fixtures, reached as ${fixtures}):
#   1px.png             1x1 minimum-dimension PNG
#   large.png           10000x1 extremely wide PNG
#   tall.png            1x10000 extremely tall PNG
#   transparent.png     4x4 fully transparent PNG (all alpha=0)
#   semitransparent.png 16x8 with partial alpha
#   exif-rotated.jpg    40x20 JPEG with EXIF Orientation=6 (90 degrees CW)
#   exif-transposed-5.jpg  40x20 JPEG with EXIF Orientation=5 (mirror + 270 CW)
#   exif-transposed-7.jpg  40x20 JPEG with EXIF Orientation=7 (mirror + 90 CW)
#   cmyk.jpg            CMYK color space JPEG
#   truncated.jpg       JPEG truncated mid-stream (~60% of data)
#   corrupt-header.jpg  JPEG with zeroed header bytes
#   invalid-chunk.png   PNG with invalid chunk type and bad CRC
#   zero-bytes.bin      Empty file (0 bytes)
#   random-noise.bin    256 bytes of random data
#
# Run with: e2e/run.sh
version: "1"

suite:
  name: truss edge cases

scenarios:
  - name: inspects a 1x1 PNG
    steps:
      - run:
          command: truss inspect "${fixtures}/1px.png"
      - assert:
          exit_code: 0
          stdout:
            json:
              path: $.width
              equals: 1
      - assert:
          stdout:
            json:
              path: $.height
              equals: 1

  - name: converts a 1x1 PNG to JPEG
    steps:
      - run:
          command: truss convert "${fixtures}/1px.png" -o 1px.jpg
      - assert:
          exit_code: 0
          image:
            path: 1px.jpg
            format: jpeg

  - name: inspects a 10000x1 PNG
    steps:
      - run:
          command: truss inspect "${fixtures}/large.png"
      - assert:
          exit_code: 0
          stdout:
            json:
              path: $.width
              equals: 10000
      - assert:
          stdout:
            json:
              path: $.height
              equals: 1

  - name: converts a 10000x1 PNG to JPEG
    steps:
      - run:
          command: truss convert "${fixtures}/large.png" -o large.jpg
      - assert:
          exit_code: 0
          image:
            path: large.jpg
            format: jpeg

  - name: inspects a 1x10000 PNG
    steps:
      - run:
          command: truss inspect "${fixtures}/tall.png"
      - assert:
          exit_code: 0
          stdout:
            json:
              path: $.width
              equals: 1
      - assert:
          stdout:
            json:
              path: $.height
              equals: 10000

  - name: converts a 1x10000 PNG to JPEG
    steps:
      - run:
          command: truss convert "${fixtures}/tall.png" -o tall.jpg
      - assert:
          exit_code: 0
          image:
            path: tall.jpg
            format: jpeg

  - name: inspects a fully transparent PNG (hasAlpha true)
    steps:
      - run:
          command: truss inspect "${fixtures}/transparent.png"
      - assert:
          exit_code: 0
          stdout:
            json:
              path: $.hasAlpha
              equals: true

  - name: converts a fully transparent PNG to JPEG without error
    steps:
      # JPEG does not support alpha — truss should composite over a background.
      - run:
          command: truss convert "${fixtures}/transparent.png" -o transparent.jpg
      - assert:
          exit_code: 0
          image:
            path: transparent.jpg
            format: jpeg

  - name: converts a semi-transparent PNG to JPEG
    steps:
      # The source really does carry partial alpha, so this pins the flattening: JPEG has
      # no alpha channel, and the output must come out fully opaque rather than carrying
      # a channel the format cannot store.
      - run:
          command: truss inspect "${fixtures}/semitransparent.png"
      - assert:
          exit_code: 0
          stdout:
            json:
              path: $.hasAlpha
              equals: true
      - run:
          command: truss convert "${fixtures}/semitransparent.png" -o semi.jpg
      - assert:
          exit_code: 0
          image:
            path: semi.jpg
            format: jpeg
            alpha: false
      # Partial alpha survives a format that can hold it.
      - run:
          command: truss convert "${fixtures}/semitransparent.png" -o semi.png
      - assert:
          exit_code: 0
          image:
            path: semi.png
            format: png
            alpha: true

  - name: JPEG output composites alpha the same way with and without a padding stage
    steps:
      # JPEG has no alpha channel. Truncating it leaves a half-transparent red as a fully
      # saturated red and a fully transparent pixel as black; compositing resolves it
      # against the background. A `contain` resize already composites on its way through,
      # so the two paths agreeing is the property, and the one that used to be false.
      - run:
          command: truss convert "${fixtures}/semitransparent.png" -o direct.jpg --background ffffff
      - assert:
          exit_code: 0
      - run:
          command: truss convert "${fixtures}/semitransparent.png" -o padded.jpg --width 16 --height 8 --fit contain --background ffffff
      - assert:
          exit_code: 0
          image:
            path: direct.jpg
            similar_to: padded.jpg

  - name: a fully transparent PNG converts to the background color, not to black
    steps:
      # The default for a format without alpha is white, which is what the padding path
      # has always used. An explicit --background wins over it on the direct path too.
      - run:
          command: truss convert "${fixtures}/transparent.png" -o white.jpg
      - assert:
          exit_code: 0
      - run:
          command: truss convert "${fixtures}/transparent.png" -o white-padded.jpg --width 4 --height 4 --fit contain
      - assert:
          exit_code: 0
          image:
            path: white.jpg
            similar_to: white-padded.jpg
      - run:
          command: truss convert "${fixtures}/transparent.png" -o red.jpg --background ff0000
      - assert:
          exit_code: 0
      - run:
          command: truss convert "${fixtures}/transparent.png" -o red-padded.jpg --width 4 --height 4 --fit contain --background ff0000
      - assert:
          exit_code: 0
          image:
            path: red.jpg
            similar_to: red-padded.jpg

  - name: alpha-capable output formats keep their transparency
    steps:
      # Flattening is only correct where the channel cannot survive the encode. PNG and
      # WebP carry it, so the same source must come out with alpha intact.
      - run:
          command: truss convert "${fixtures}/semitransparent.png" -o keep.png
      - assert:
          exit_code: 0
          image:
            path: keep.png
            format: png
            alpha: true
      - run:
          command: truss convert "${fixtures}/semitransparent.png" -o keep.webp
      - assert:
          exit_code: 0
          image:
            path: keep.webp
            format: webp
            alpha: true

  - name: inspect reports the stored size of an EXIF-rotated JPEG
    steps:
      # inspect reads the container, so it reports what the file stores (40x20). The
      # orientation tag says how to display it; applying that is convert's job.
      - run:
          command: truss inspect "${fixtures}/exif-rotated.jpg"
      - assert:
          exit_code: 0
          stdout:
            json:
              - path: $.format
                equals: jpeg
              - path: $.width
                equals: 40
              - path: $.height
                equals: 20

  - name: converting an EXIF-rotated JPEG applies the orientation
    steps:
      # Orientation=6 means "rotate 90 degrees clockwise to display". A phone photo is the
      # everyday case, and getting this wrong ships sideways images, so the dimension swap
      # is the assertion, not just that a PNG came out.
      - run:
          command: truss convert "${fixtures}/exif-rotated.jpg" -o exif.png
      - assert:
          exit_code: 0
          image:
            path: exif.png
            format: png
            width: 20
            height: 40

  - name: --no-auto-orient leaves an EXIF-rotated JPEG as stored
    steps:
      - run:
          command: truss convert "${fixtures}/exif-rotated.jpg" -o as-stored.png --no-auto-orient
      - assert:
          exit_code: 0
          image:
            path: as-stored.png
            format: png
            width: 40
            height: 20

  - name: inspect reports the orientation tag and the dimensions convert will produce
    steps:
      # width/height are what the container stores; orientedWidth/orientedHeight are what
      # `convert` produces. A caller that records dimensions at upload time and serves
      # derivatives later needs the second pair, and cannot derive it from the first.
      - run:
          command: truss inspect "${fixtures}/exif-rotated.jpg"
      - assert:
          exit_code: 0
          stdout:
            json:
              - path: $.width
                equals: 40
              - path: $.height
                equals: 20
              - path: $.orientation
                equals: 6
              - path: $.orientedWidth
                equals: 20
              - path: $.orientedHeight
                equals: 40

  - name: inspect reports the stored dimensions as oriented when there is no orientation tag
    steps:
      # sample.png has no EXIF at all, so the two pairs agree. This is what lets a caller
      # read orientedWidth/orientedHeight unconditionally instead of branching.
      - run:
          command: truss inspect "${fixtures}/sample.png"
      - assert:
          exit_code: 0
          stdout:
            json:
              - path: $.width
                equals: 4
              - path: $.orientedWidth
                equals: 4
              - path: $.height
                equals: 3
              - path: $.orientedHeight
                equals: 3

  - name: converting applies EXIF orientation 5 as mirror plus 270 CW
    steps:
      # Orientations 5 to 8 all turn 40x20 into 20x40, so the dimensions cannot tell them
      # apart. The baseline is Pillow's exif_transpose output, an independent oracle, so
      # this fails if the transform is the one that belongs to another orientation value.
      - run:
          command: truss convert "${fixtures}/exif-transposed-5.jpg" -o o5.png
      - assert:
          exit_code: 0
          image:
            path: o5.png
            format: png
            width: 20
            height: 40
      - assert:
          image:
            path: o5.png
            similar_to: testdata/exif-orientation-5.png
            max_diff: 0.01

  - name: converting applies EXIF orientation 7 as mirror plus 90 CW
    steps:
      - run:
          command: truss convert "${fixtures}/exif-transposed-7.jpg" -o o7.png
      - assert:
          exit_code: 0
          image:
            path: o7.png
            format: png
            width: 20
            height: 40
      - assert:
          image:
            path: o7.png
            similar_to: testdata/exif-orientation-7.png
            max_diff: 0.01

  - name: inspects a CMYK JPEG
    steps:
      - run:
          command: truss inspect "${fixtures}/cmyk.jpg"
      - assert:
          exit_code: 0
          stdout:
            json:
              path: $.format
              equals: jpeg

  - name: converts a CMYK JPEG to PNG
    steps:
      - run:
          command: truss convert "${fixtures}/cmyk.jpg" -o cmyk.png
      - assert:
          exit_code: 0
          image:
            path: cmyk.png
            format: png

  - name: inspect may succeed on a truncated JPEG (header intact)
    steps:
      # The JPEG header is valid so inspect can read dimensions, but the
      # image data is incomplete.
      - run:
          command: truss inspect "${fixtures}/truncated.jpg"
      - assert:
          exit_code: 0
          stdout:
            contains: '"format"'

  - name: convert fails on a truncated JPEG (exit 4, transform/decode error)
    steps:
      - run:
          command: truss convert "${fixtures}/truncated.jpg" -o trunc.png
      - assert:
          exit_code: 4
          stderr:
            contains: "error:"

  - name: inspects a corrupt-header JPEG (graceful handling)
    steps:
      # The corruption is mild enough that the decoder still works.
      - run:
          command: truss inspect "${fixtures}/corrupt-header.jpg"
      - assert:
          exit_code: 0
          stdout:
            contains: '"format"'

  - name: converts a corrupt-header JPEG
    steps:
      - run:
          command: truss convert "${fixtures}/corrupt-header.jpg" -o corrupt.png
      - assert:
          exit_code: 0

  - name: inspects a PNG with an invalid chunk (tolerant decoder)
    steps:
      - run:
          command: truss inspect "${fixtures}/invalid-chunk.png"
      - assert:
          exit_code: 0
          stdout:
            contains: '"format"'

  - name: converts a PNG with an invalid chunk
    steps:
      - run:
          command: truss convert "${fixtures}/invalid-chunk.png" -o badchunk.jpg
      - assert:
          exit_code: 0

  - name: rejects an empty file (exit 3, unsupported format)
    steps:
      - run:
          command: truss inspect "${fixtures}/zero-bytes.bin"
      - assert:
          exit_code: 3
          stderr:
            contains: "error:"

  - name: rejects random binary data (exit 3, unsupported format)
    steps:
      - run:
          command: truss inspect "${fixtures}/random-noise.bin"
      - assert:
          exit_code: 3
          stderr:
            contains: "error:"

  - name: a negative crop origin is answered by the crop validator, not by the argument parser
    steps:
      - run:
          command: truss convert "${fixtures}/1px.png" -o negcrop.png --crop -1,0,2,2
      - assert:
          exit_code: 1
          stderr:
            contains: "crop x must be a non-negative integer"

  - name: an out-of-range blur sigma is invalid-options, the class every adapter reports
    steps:
      - run:
          command: truss convert "${fixtures}/1px.png" -o blur.png --blur 0
      - assert:
          exit_code: 1
          stderr:
            contains: "(invalid-options)"

  - name: an out-of-range sharpen sigma is invalid-options too
    steps:
      - run:
          command: truss convert "${fixtures}/1px.png" -o sharpen.png --sharpen 100.1
      - assert:
          exit_code: 1
          stderr:
            contains: "(invalid-options)"

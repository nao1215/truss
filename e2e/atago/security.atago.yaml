# Migrated from ShellSpec integration/cli/spec/security_spec.sh.
# SVG files can contain embedded scripts (XSS), XML entity expansion attacks
# (billion laughs), and external resource references (SSRF). truss must
# neutralize these threats when converting SVG to raster.
#
# Fixtures (integration/fixtures, reached as ${fixtures}):
#   svg-entity-bomb.svg         XML entity expansion (<!ENTITY> nesting)
#   svg-script.svg              <script>, onclick, onload attributes
#   svg-external-ref.svg        External xlink:href references
#   svg-minimal.svg             Smallest valid SVG (1x1, no content)
#   svg-animate-xss.svg         SMIL <animate>/<set> setting href, plus <handler>
#   svg-external-css.svg        xml-stylesheet PI, presentation-attribute url(), escaped @import
#   svg-illustrator-prolog.svg  The XML prolog Adobe Illustrator writes
#
# Run with: e2e/run.sh
version: "1"

suite:
  name: truss svg security

scenarios:
  - name: rejects SVG with entity expansion (does not hang or OOM)
    steps:
      # The entity bomb SVG uses nested <!ENTITY> declarations. truss should
      # reject it rather than expanding entities.
      - run:
          command: truss convert "${fixtures}/svg-entity-bomb.svg" -o bomb.png --format png
      - assert:
          exit_code: { not: 0 }
          stderr:
            contains: "error:"

  - name: converts SVG with embedded scripts to raster without error
    steps:
      # Scripts are irrelevant in raster output — the SVG sanitizer strips
      # them during parsing, and the rasterizer never executes JS.
      - run:
          command: truss convert "${fixtures}/svg-script.svg" -o noscript.png --format png
      - assert:
          exit_code: 0
          image:
            path: noscript.png
            format: png

  - name: converts SVG with external refs (refs are not fetched)
    steps:
      # External xlink:href URLs must NOT be fetched during conversion. The
      # converter should either strip them or ignore them.
      - run:
          command: truss convert "${fixtures}/svg-external-ref.svg" -o noextref.png --format png
      - assert:
          exit_code: 0
          image:
            path: noextref.png
            format: png

  - name: strips SMIL animation that sets href at render time
    steps:
      # The attribute filter only inspects `href`. SMIL writes it after the fact through
      # `to`/`values`/`from`/`by`, so the canonical payload used to pass through a
      # sanitizer that removes <script> and on* handlers byte for byte. `convert` to SVG
      # is the sanitize-only path, so the output is the sanitizer's own answer.
      - run:
          command: truss convert "${fixtures}/svg-animate-xss.svg" -o sanitized.svg --format svg
      - assert:
          exit_code: 0
      - assert:
          file:
            path: sanitized.svg
            not_contains:
              - "javascript:"
              - "evil.example.com"
              - "animate"
              - "handler"

  - name: rasterizes the SMIL payload without executing it
    steps:
      - run:
          command: truss convert "${fixtures}/svg-animate-xss.svg" -o animated.png --format png
      - assert:
          exit_code: 0
          image:
            path: animated.png
            format: png

  - name: strips external references that are neither an element nor an href
    steps:
      # A stylesheet processing instruction, a url() written as a presentation
      # attribute rather than in `style`, and an @import whose at-keyword carries a
      # CSS escape. None of the three is an element or an href, so the element and
      # href rules never saw them. `convert` to SVG is the sanitize-only path, so
      # the output is the sanitizer's own answer.
      - run:
          command: truss convert "${fixtures}/svg-external-css.svg" -o external-css.svg --format svg
      - assert:
          exit_code: 0
      - assert:
          file:
            path: external-css.svg
            not_contains:
              - "evil.example.com"
              - "xml-stylesheet"
              - "mport"

  - name: rasterizes the external-reference payload without fetching anything
    steps:
      - run:
          command: truss convert "${fixtures}/svg-external-css.svg" -o external-css.png --format png
      - assert:
          exit_code: 0
          image:
            path: external-css.png
            format: png

  - name: reads an SVG carrying the prolog Adobe Illustrator writes
    steps:
      # A generator comment before the doctype and a doctype with an internal subset
      # are both legal prolog. Detection used to walk a fixed sequence instead of the
      # grammar and refused the file as an unknown signature.
      - run:
          command: truss inspect "${fixtures}/svg-illustrator-prolog.svg"
      - assert:
          exit_code: 0
          stdout:
            contains: '"svg"'

  - name: converts an SVG carrying the Illustrator prolog to PNG
    steps:
      - run:
          command: truss convert "${fixtures}/svg-illustrator-prolog.svg" -o illustrator.png --format png
      - assert:
          exit_code: 0
          image:
            path: illustrator.png
            format: png

  - name: inspects a minimal SVG
    steps:
      - run:
          command: truss inspect "${fixtures}/svg-minimal.svg"
      - assert:
          exit_code: 0
          stdout:
            contains: '"svg"'

  - name: converts a minimal SVG to PNG
    steps:
      - run:
          command: truss convert "${fixtures}/svg-minimal.svg" -o minimal.png --format png
      - assert:
          exit_code: 0
          image:
            path: minimal.png
            format: png

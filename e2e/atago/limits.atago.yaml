# Output pixel-budget enforcement (MAX_OUTPUT_PIXELS = 67_108_864).
#
# Regression coverage for https://github.com/nao1215/truss/issues/252: the limit
# used to be computed against the SOURCE size of whichever axis the user omitted,
# so `--width 10000` on a 16x16 input passed the check and then allocated a
# 100-megapixel buffer. The limit now runs against the aspect-scaled output size,
# so a single oversized dimension is rejected before anything is allocated.
#
# The input is the committed 16x16 testdata/sample.png (square, so a width-only
# resize scales the height by the same factor). Run with: e2e/run.sh
version: "1"

suite:
  name: truss output pixel limits

scenarios:
  - name: rejects a width-only resize whose aspect-scaled output exceeds the limit
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss convert in.png -o big.png --width 10000
      - assert:
          exit_code: 4
          stderr:
            contains:
              - "error:"
              - "output image would have 100000000 pixels"
          # The output must never be written: the limit is a pre-allocation check.
          changes:
            created: []
            modified: []
            deleted: []
      - assert:
          file:
            path: big.png
            exists: false

  - name: rejects a height-only resize whose aspect-scaled output exceeds the limit
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss convert in.png -o tall.png --height 10000
      - assert:
          exit_code: 4
          stderr:
            contains: "output image would have 100000000 pixels"
      - assert:
          file:
            path: tall.png
            exists: false

  - name: rejects a gigapixel width-only resize quickly instead of hanging
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      # 65536x65536 is ~4.3 gigapixels. Before the fix this got past the check
      # and stalled trying to allocate the resize buffer.
      - run:
          command: truss convert in.png -o huge.png --width 65536
      - assert:
          exit_code: 4
          stderr:
            contains: "output image would have"
          duration:
            lt: 20s
      - assert:
          file:
            path: huge.png
            exists: false

  - name: rejects a resize when both dimensions exceed the limit together
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      # 8193 * 8192 = 67_116_032, just over MAX_OUTPUT_PIXELS.
      - run:
          command: truss convert in.png -o both.png --width 8193 --height 8192
      - assert:
          exit_code: 4
          stderr:
            contains: "output image would have 67117056 pixels"

  - name: rejects fit=cover when the pre-crop buffer exceeds the limit
    steps:
      # cover scales the source until it covers the box on BOTH axes and crops afterwards,
      # so the buffer it materializes is not the size it returns. A 10000x1 source into a
      # 3x9999 box returns 3x9999 (29,997 pixels) after scaling to 99990000x9999 first.
      # The limit has to see the buffer, or the allocation aborts the process.
      - run:
          command: truss convert "${fixtures}/large.png" -o cover.png --width 3 --height 9999 --fit cover
      - assert:
          exit_code: 4
          stderr:
            contains:
              - "error:"
              - "fit=cover scales 10000x1"
          duration:
            lt: 20s
      - assert:
          file:
            path: cover.png
            exists: false

  - name: the other fit modes accept the request cover rejects
    steps:
      # They scale by the smaller ratio, so their buffer is bounded by the box. This is
      # what makes the cover rejection specific rather than a blanket refusal.
      - run:
          command: truss convert "${fixtures}/large.png" -o contain.png --width 3 --height 9999 --fit contain
      - assert:
          exit_code: 0
          image:
            path: contain.png
            width: 3
            height: 9999
      - run:
          command: truss convert "${fixtures}/large.png" -o inside.png --width 3 --height 9999 --fit inside
      - assert:
          exit_code: 0
          image:
            path: inside.png
            width: 3
            height: 1

  - name: allows fit=cover when the pre-crop buffer stays inside the limit
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss convert in.png -o ok-cover.png --width 8 --height 32 --fit cover
      - assert:
          exit_code: 0
          image:
            path: ok-cover.png
            format: png
            width: 8
            height: 32

  - name: allows a width-only resize that stays inside the limit
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss convert in.png -o ok.png --width 512
      - assert:
          exit_code: 0
          image:
            path: ok.png
            format: png
            width: 512
            height: 512

  - name: allows a height-only resize that stays inside the limit
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss convert in.png -o ok-h.png --height 512
      - assert:
          exit_code: 0
          image:
            path: ok-h.png
            format: png
            width: 512
            height: 512

  # The output format's own ceiling, which the pixel budget does not cover: an output can be
  # tens of thousands of pixels on one axis while staying well inside 67,108,864.
  - name: rejects a webp output longer on an axis than the format holds
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss convert in.png -o wide.webp --format webp --width 20000 --height 3000 --fit fill
      - assert:
          exit_code: 4
          stderr:
            contains:
              - "error:"
              - "webp output cannot be 20000x3000"
              - "16383"
          changes:
            created: []
            modified: []
            deleted: []
      - assert:
          file:
            path: wide.webp
            exists: false

  # The lossy encoder is what `--quality` selects, and it used to unwind out of libwebp with
  # `VP8_ENC_ERROR_BAD_DIMENSION` rather than returning. Exit 5 with a panic dump was the
  # symptom; the point of this case is that the refusal is a classified exit 4.
  - name: rejects a lossy webp past the ceiling instead of panicking
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss convert in.png -o wide.webp --format webp --quality 50 --width 16384 --height 1 --fit fill
      - assert:
          exit_code: 4
          stderr:
            contains: "webp output cannot be 16384x1"
            not_contains: "panicked"
      - assert:
          file:
            path: wide.webp
            exists: false

  - name: rejects a jpeg output longer on an axis than the format holds
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss convert in.png -o wide.jpg --format jpeg --width 65536 --height 1 --fit fill
      - assert:
          exit_code: 4
          stderr:
            contains: "jpeg output cannot be 65536x1"

  - name: allows a webp output at the last size the format holds
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss convert in.png -o edge.webp --format webp --quality 50 --width 16383 --height 1 --fit fill
      - assert:
          exit_code: 0
          image:
            path: edge.webp
            format: webp
            width: 16383
            height: 1

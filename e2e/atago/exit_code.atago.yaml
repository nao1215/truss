# Migrated from ShellSpec integration/cli/spec/exit_code_spec.sh.
# truss uses structured exit codes so that scripts and CI pipelines can
# distinguish between different failure modes:
#
#   0  Success
#   1  Usage error (bad arguments, missing required flags)
#   2  I/O error (file not found, permission denied, network failure)
#   3  Input error (unsupported format, corrupt file)
#   4  Transform error (encode failure, size limit exceeded, deadline)
#   5  Runtime error (bind failure, stdout write failure)
#
# Every message also names the class of the failure in parentheses, one of the slugs in
# docs/problems.md, which is the same class the HTTP server puts in its RFC 9457 `type` and
# @nao1215/truss-wasm reports as `kind`. The scenarios below assert the class alongside the
# exit code, because the exit code alone is coarser: exit 1 is both a command line that does
# not parse (invalid-request) and transform options the pipeline refuses (invalid-options).
#
# Code 5 has no scenario here: producing a failing stdout portably would mean a full
# filesystem or a closed pipe, neither of which a spec can arrange on all three
# platforms. It is covered by unit tests instead.
#
# Run with: e2e/run.sh
version: "1"

suite:
  name: truss exit codes

scenarios:
  - name: "exit 0: help"
    steps:
      - run:
          command: truss --help
      - assert:
          exit_code: 0
          stdout:
            contains: "USAGE"

  - name: "exit 0: successful conversion"
    steps:
      - run:
          command: truss convert "${fixtures}/sample.png" -o ok.jpg
      - assert:
          exit_code: 0

  - name: "exit 0: successful inspection"
    steps:
      - run:
          command: truss inspect "${fixtures}/sample.png"
      - assert:
          exit_code: 0
          stdout:
            contains: '"format"'

  - name: "exit 1: convert is missing --output"
    steps:
      - run:
          command: truss convert "${fixtures}/sample.png"
      - assert:
          exit_code: 1
          stderr:
            contains: "error:"

  - name: "exit 1: unknown command"
    steps:
      - run:
          command: truss notacommand
      - assert:
          exit_code: 1
          stderr:
            contains:
              - "error:"
              - "(invalid-request)"

  - name: "exit 1: inspect has no input"
    steps:
      - run:
          command: truss inspect
      - assert:
          exit_code: 1
          stderr:
            contains: "error:"

  - name: "exit 1: sign has no arguments"
    steps:
      - run:
          command: truss sign
      - assert:
          exit_code: 1
          stderr:
            contains: "error:"

  - name: "exit 2: inspect input file does not exist"
    steps:
      - run:
          command: truss inspect /no/such/file.png
      - assert:
          exit_code: 2
          stderr:
            contains: "error:"

  - name: "exit 2: convert input file does not exist"
    steps:
      - run:
          command: truss convert /no/such/file.png -o out.jpg
      - assert:
          exit_code: 2
          stderr:
            contains:
              - "error:"
              # A source that is not there is the class the server answers 404 with.
              - "(not-found)"

  - name: "exit 3: corrupt image data"
    steps:
      - fixture:
          file: corrupt.dat
          content: "this is not an image"
      - run:
          command: truss inspect corrupt.dat
      - assert:
          exit_code: 3
          stderr:
            contains: "error:"

  - name: "exit 3: empty file (zero bytes)"
    steps:
      - run:
          command: truss inspect "${fixtures}/zero-bytes.bin"
      - assert:
          exit_code: 3
          stderr:
            contains:
              - "error:"
              - "(unsupported-input-media-type)"

  - name: "exit 3: random binary data"
    steps:
      - run:
          command: truss inspect "${fixtures}/random-noise.bin"
      - assert:
          exit_code: 3
          stderr:
            contains: "error:"

  # The message here is a decoder's own wording, which ends with a newline. The class has
  # to stay on the same line as the message it belongs to, so the regex is anchored with a
  # character class that a line break cannot satisfy.
  - name: "exit 4: converting a truncated JPEG"
    steps:
      - run:
          command: truss convert "${fixtures}/truncated.jpg" -o trunc.png
      - assert:
          exit_code: 4
          stderr:
            contains:
              - "error:"
              - "(decode-failed)"
            matches: "error: [^\\n]*\\(decode-failed\\)"

  # Exit 1 covers two classes, and the class is what tells them apart: a command line that
  # does not parse is invalid-request, options the pipeline refuses are invalid-options.
  - name: "exit 1: transform options the pipeline refuses"
    steps:
      - run:
          command: truss convert "${fixtures}/sample.png" -o out.png --width 10 --fit cover
      - assert:
          exit_code: 1
          stderr:
            contains:
              - "fit requires both width and height"
              - "(invalid-options)"

  # An animated GIF is readable but not transformable, which is a different class from a
  # file truss cannot decode at all, and a different exit code.
  - name: "exit 3: an input truss reads but cannot transform"
    steps:
      - run:
          command: truss convert "${fixtures}/animated.gif" -o out.png
      - assert:
          exit_code: 3
          stderr:
            contains:
              - "animated gif is not supported"
              - "(unsupported-input-media-type)"

  - name: "exit 4: an output larger than the pixel budget"
    steps:
      - run:
          command: truss convert "${fixtures}/1px.png" -o huge.png --width 20000 --height 20000
      - assert:
          exit_code: 4
          stderr:
            contains:
              - "limit is 67108864"
              - "(limit-exceeded)"

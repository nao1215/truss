# Migrated from ShellSpec integration/cli/spec/sign_spec.sh.
# The sign command generates HMAC-signed public URLs for the truss HTTP
# server. These URLs allow clients to request specific transformations
# without needing direct API access.
#
#   truss sign --base-url <URL> --path <PATH> \
#     --key-id <ID> --secret <SECRET> --expires <UNIX_SECS> [OPTIONS]
#
# Run with: e2e/run.sh
version: "1"

suite:
  name: truss sign

scenarios:
  - name: shows help with --help
    steps:
      - run:
          command: truss sign --help
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "truss sign"
              - "--base-url"

  - name: exits 1 with usage and hint when no arguments are given
    steps:
      - run:
          command: truss sign
      - assert:
          exit_code: 1
          stderr:
            contains:
              - "error:"
              - "usage:"
              - "hint:"

  - name: produces a signed HTTPS URL with all required arguments
    steps:
      - run:
          command: truss sign --base-url "https://cdn.example.com" --path "/photos/hero.jpg" --key-id "testkey" --secret "testsecret" --expires 1700000000
      - assert:
          exit_code: 0
          stdout:
            contains: "https://"

  - name: includes transform options in the signed URL
    steps:
      - run:
          command: truss sign --base-url "https://cdn.example.com" --path "/photos/hero.jpg" --key-id "testkey" --secret "testsecret" --expires 1700000000 --width 640 --format webp
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "https://"
              - "640"

  - name: the signed URL is byte-identical to the one the TypeScript signer produces
    steps:
      # packages/truss-url-signer signs the same request in JavaScript, and its test suite
      # pins this exact string. Two signers that drift produce URLs the server rejects, so
      # the constant is asserted from both sides.
      - run:
          command: truss sign --base-url "https://cdn.example.com" --path "/hero.jpg" --key-id "k1" --secret "s3cret" --expires 1700000000
      - assert:
          exit_code: 0
          stdout:
            equals: "https://cdn.example.com/images/by-path?expires=1700000000&keyId=k1&path=%2Fhero.jpg&signature=dab916051280ac685f656e44884e6a87f2822d0a5de48b657e95616a86a364eb"

  - name: the signature is 64 lowercase hex characters
    steps:
      # docs/signed-url-spec.md fixes the encoding, and the server now rejects anything
      # else: one signed URL has to be one URL string, or a CDN caches it under as many
      # keys as there are case permutations. Pinning the signer here is what keeps the two
      # ends from drifting in opposite directions.
      - run:
          command: truss sign --base-url "https://cdn.example.com" --path "/hero.jpg" --key-id "k1" --secret "s3cret" --expires 1700000000 --width 800
      - assert:
          exit_code: 0
          stdout:
            matches: "signature=[0-9a-f]{64}(&|$)"
      - assert:
          stdout:
            not_matches: "signature=[0-9a-f]*[A-F]"

  - name: --preserve-exif signs both the flag and the stripping it implies
    steps:
      # preserveExif means "do not strip", so the signed query carries stripMetadata=false
      # as well. Signing only one of the pair would produce a URL the server resolves
      # differently from what the caller asked for.
      - run:
          command: truss sign --base-url "https://cdn.example.com" --path "/hero.jpg" --key-id "k1" --secret "s3cret" --expires 1700000000 --preserve-exif
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "preserveExif=true"
              - "stripMetadata=false"

  - name: an expiry in the past still signs, because expiry is the server's to check
    steps:
      - run:
          command: truss sign --base-url "https://cdn.example.com" --path "/hero.jpg" --key-id "k1" --secret "s3cret" --expires 1
      - assert:
          exit_code: 0
          stdout:
            contains: "expires=1"

  - name: --path and --url are mutually exclusive
    steps:
      - run:
          command: truss sign --base-url "https://cdn.example.com" --path "/hero.jpg" --url "https://example.com/a.png" --key-id "k1" --secret "s3cret" --expires 1700000000
      - assert:
          exit_code: 1
          stderr:
            contains: "error:"

  - name: the same request signs to the same URL every time
    steps:
      - run:
          command: truss sign --base-url "https://cdn.example.com" --path "/hero.jpg" --key-id "k1" --secret "s3cret" --expires 1700000000 --width 640 --format webp --grayscale
          deterministic:
            runs: 2
            compare: [stdout, exit_code]
      - assert:
          exit_code: 0

  # A signed URL is usually written somewhere other than where it is fetched, so an
  # option set the server refuses under every input has to be refused here rather than
  # at request time. Nothing may reach stdout: a URL there is a URL a caller pipes on.
  - name: refuses a fit without both dimensions instead of signing it
    steps:
      - run:
          command: truss sign --base-url "https://cdn.example.com" --path "/hero.jpg" --key-id "k1" --secret "s3cret" --expires 1700000000 --fit cover
      - assert:
          exit_code: 1
          stdout:
            equals: ""
          stderr:
            contains:
              - "fit requires both width and height"
              - "(invalid-options)"

  - name: refuses a position without both dimensions instead of signing it
    steps:
      - run:
          command: truss sign --base-url "https://cdn.example.com" --path "/hero.jpg" --key-id "k1" --secret "s3cret" --expires 1700000000 --position center
      - assert:
          exit_code: 1
          stdout:
            equals: ""
          stderr:
            contains:
              - "position requires both width and height"
              - "(invalid-options)"

  - name: refuses a quality outside the encoder range instead of signing it
    steps:
      - run:
          command: truss sign --base-url "https://cdn.example.com" --path "/hero.jpg" --key-id "k1" --secret "s3cret" --expires 1700000000 --quality 101
      - assert:
          exit_code: 1
          stdout:
            equals: ""
          stderr:
            contains:
              - "quality must be between 1 and 100"
              - "(invalid-options)"

  - name: refuses a zero width instead of signing it
    steps:
      - run:
          command: truss sign --base-url "https://cdn.example.com" --path "/hero.jpg" --key-id "k1" --secret "s3cret" --expires 1700000000 --width 0
      - assert:
          exit_code: 1
          stdout:
            equals: ""
          stderr:
            contains:
              - "width must be greater than zero"
              - "(invalid-options)"

  # An unset shell variable expands to the empty string, so these are what a typo in a
  # variable name produces in a build script. A server refuses to start with an empty key
  # id or secret, and the by-path route refuses an empty path, so each of these URLs would
  # be answered 400 or 401 for as long as it existed.
  - name: refuses an empty key id instead of signing it
    steps:
      - run:
          command: truss sign --base-url "https://cdn.example.com" --path "/hero.jpg" --key-id "" --secret "s3cret" --expires 1700000000
      - assert:
          exit_code: 1
          stdout:
            equals: ""
          stderr:
            contains:
              - "key id must not be empty"
              - "(invalid-request)"

  - name: refuses an empty secret instead of signing it
    steps:
      - run:
          command: truss sign --base-url "https://cdn.example.com" --path "/hero.jpg" --key-id "k1" --secret "" --expires 1700000000
      - assert:
          exit_code: 1
          stdout:
            equals: ""
          stderr:
            contains:
              - "secret must not be empty"
              - "(invalid-request)"

  - name: refuses an empty path instead of signing it
    steps:
      - run:
          command: truss sign --base-url "https://cdn.example.com" --path "" --key-id "k1" --secret "s3cret" --expires 1700000000
      - assert:
          exit_code: 1
          stdout:
            equals: ""
          stderr:
            contains:
              - "path must not be empty"
              - "(invalid-request)"

  # A base URL with a path is a deployment served under a prefix by a proxy that strips it
  # before truss sees the request. The prefix belongs in the URL; the signature is over the
  # endpoint path the server receives, so it is the same one the prefix-free base URL gives.
  - name: keeps a path in the base URL and signs the endpoint path regardless
    steps:
      - run:
          command: truss sign --base-url "https://cdn.example.com/img" --path "/hero.jpg" --key-id "k1" --secret "s3cret" --expires 1700000000
      - assert:
          exit_code: 0
          stdout:
            contains: "https://cdn.example.com/img/images/by-path?"
      - run:
          command: truss sign --base-url "https://cdn.example.com" --path "/hero.jpg" --key-id "k1" --secret "s3cret" --expires 1700000000
      - assert:
          exit_code: 0
          stdout:
            contains: "https://cdn.example.com/images/by-path?"

# `truss optimize`, which the other specs only touched in passing.
#
# optimize is convert with the geometry flags removed and the encoder told to work
# harder, so what is worth pinning is the part that is not convert: that a mode does what
# its name says, that the output format still comes from the extension, and that the
# pixels survive. Byte sizes are deliberately not asserted as targets — an encoder
# upgrade is allowed to change them — except where the mode's definition depends on it.
#
# Run with: e2e/run.sh --filter optimize
version: "1"

suite:
  name: truss optimize

scenarios:
  - name: optimizing a flat JPEG returns it rather than a larger re-encode
    steps:
      # An encoder does not always beat whatever produced the input. A flat colour is the
      # everyday case where it does not, and auto used to compare two re-encodes and never
      # the bytes it was handed, so it returned a bigger file than lossless did — having
      # paid a generation loss for it. The snapshot pins both files' hashes, and they are
      # the same hash: the output IS the input.
      - fixture:
          file: in.jpg
          from: ${fixtures}/flat.jpg
      - run:
          command: truss optimize in.jpg -o out.jpg --mode auto
      - assert:
          exit_code: 0
          image:
            path: out.jpg
            format: jpeg
            width: 256
            height: 256
      - assert:
          dir:
            path: .
            snapshot: testdata/optimize-flat-jpeg.snap

  - name: optimizing an indexed PNG returns it, palette and all
    steps:
      # PNG-8 is what a design tool exports for an icon or a flat illustration. There is
      # no encoder for colour type 3 here, so a re-encode comes back as truecolour and 45%
      # larger; handing back the input keeps both the size and the colour model.
      - fixture:
          file: in.png
          from: ${fixtures}/indexed.png
      - run:
          command: truss optimize in.png -o out.png --mode lossless
      - assert:
          exit_code: 0
          image:
            path: out.png
            format: png
            width: 128
            height: 128
      - assert:
          dir:
            path: .
            snapshot: testdata/optimize-indexed-png.snap

  - name: auto does the same for an indexed PNG
    steps:
      - fixture:
          file: in.png
          from: ${fixtures}/indexed.png
      - run:
          command: truss optimize in.png -o out.png --mode auto
      - assert:
          exit_code: 0
          dir:
            path: .
            snapshot: testdata/optimize-indexed-png.snap

  - name: an image the encoder does beat is still optimized
    steps:
      # The guard must not disable the optimization. sample.png is truecolour and truss's
      # PNG encoder compresses it better than the fixture was written, so the output is
      # smaller and therefore not the input.
      - fixture:
          file: in.png
          from: ${fixtures}/sample.png
      - run:
          command: truss optimize in.png -o out.png --mode lossless
      - assert:
          exit_code: 0
          image:
            path: out.png
            format: png
      - assert:
          dir:
            path: .
            snapshot: testdata/optimize-sample-png.snap

  - name: a request that transforms is not eligible for the passthrough
    steps:
      - fixture:
          file: in.png
          from: ${fixtures}/indexed.png
      - run:
          command: truss optimize in.png -o out.png --mode auto --format webp
      - assert:
          exit_code: 0
          image:
            path: out.png
            format: webp

  - name: lossless optimization keeps a phone photo's EXIF orientation
    steps:
      # exif-rotated.jpg is stored 40x20 with orientation 6, which is what a phone
      # produces for a portrait photo. Lossless optimization cannot rotate the pixels —
      # that would need a decode and a re-encode — but it does not need to: keeping the
      # tag leaves the stored pixels and the tag describing the same picture as before.
      - run:
          command: truss optimize "${fixtures}/exif-rotated.jpg" -o kept.jpg --mode lossless --keep-metadata
      - assert:
          exit_code: 0
      - run:
          command: truss inspect kept.jpg
      - assert:
          exit_code: 0
          stdout:
            json:
              - path: $.orientation
                equals: 6
              - path: $.width
                equals: 40
              - path: $.orientedWidth
                equals: 20
              - path: $.orientedHeight
                equals: 40

  - name: --preserve-exif is enough to keep it
    steps:
      - run:
          command: truss optimize "${fixtures}/exif-rotated.jpg" -o exif.jpg --mode lossless --preserve-exif
      - assert:
          exit_code: 0
      - run:
          command: truss inspect exif.jpg
      - assert:
          exit_code: 0
          stdout:
            json:
              path: $.orientation
              equals: 6

  - name: lossless optimization refuses an oriented JPEG whose metadata is stripped, and says why
    steps:
      # There is nowhere for the orientation to go: the pixels cannot be rotated
      # losslessly and the tag is being removed. The message has to name the orientation
      # rather than blaming a pixel transform the caller never asked for.
      - run:
          command: truss optimize "${fixtures}/exif-rotated.jpg" -o stripped.jpg --mode lossless
      - assert:
          exit_code: 4
          stderr:
            contains:
              - "error:"
              - "EXIF orientation (6)"
            not_contains: "no pixel transforms are applied"

  - name: lossless optimization of a JPEG with no orientation still works
    steps:
      - run:
          command: truss optimize "${fixtures}/sample.jpg" -o plain.jpg --mode lossless
      - assert:
          exit_code: 0
          image:
            path: plain.jpg
            format: jpeg

  - name: lossless optimization of a JPEG returns the same bytes
    steps:
      # There is nothing lossless left to do to an already-encoded JPEG, so the file is
      # passed through. A re-encode here would be a silent quality loss under a flag
      # whose name promises there is none.
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss convert in.png -o big.png --width 64 --height 64 --fit fill
      - assert:
          exit_code: 0
      - run:
          command: truss convert big.png -o photo.jpg --quality 95
      - assert:
          exit_code: 0
      - run:
          command: truss optimize photo.jpg -o same.jpg --mode lossless
      - assert:
          exit_code: 0
          file:
            path: same.jpg
            equals_file: photo.jpg

  - name: lossy optimization keeps the dimensions and the format
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss convert in.png -o big.png --width 64 --height 64 --fit fill
      - assert:
          exit_code: 0
      - run:
          command: truss convert big.png -o photo.jpg --quality 95
      - assert:
          exit_code: 0
      - run:
          command: truss optimize photo.jpg -o smaller.jpg --mode lossy --quality 40
      - assert:
          exit_code: 0
          image:
            path: smaller.jpg
            format: jpeg
            width: 64
            height: 64

  - name: the output format still comes from the extension
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss optimize in.png -o out.webp
      - assert:
          exit_code: 0
          image:
            path: out.webp
            format: webp
            width: 16
            height: 16
      - run:
          command: truss optimize in.png -o out.jpg
      - assert:
          exit_code: 0
          image:
            path: out.jpg
            format: jpeg
            width: 16
            height: 16

  - name: an explicit --format wins over the extension
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss optimize in.png -o out.bin --format png
      - assert:
          exit_code: 0
          image:
            path: out.bin
            format: png

  - name: mode none is refused because it does not optimize
    steps:
      # A mode that re-encodes without optimizing made files larger on the one subcommand
      # that promises the opposite, and it was the only mode that reached an output format
      # the others refuse. The refusal names the command that does a plain re-encode.
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss optimize in.png -o none.webp --mode none
      - assert:
          exit_code: 1
          stderr:
            contains: "truss convert"

  - name: convert is where a plain re-encode lives
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss convert in.png -o none.webp --optimize none
      - assert:
          exit_code: 0
          image:
            path: none.webp
            format: webp
            width: 16
            height: 16

  - name: lossless PNG optimization keeps the pixels
    steps:
      # PNG is lossless by construction, so whatever the optimizer does to the container
      # the image that comes back out has to be the one that went in.
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss optimize in.png -o out.png --mode lossless
      - assert:
          exit_code: 0
          image:
            path: out.png
            format: png
            similar_to: testdata/sample.png

  - name: an unknown optimize mode lists nothing it cannot do
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss optimize in.png -o out.png --mode bogus
      - assert:
          exit_code: 1
          stderr:
            contains: "unsupported optimize mode"

  - name: lossy optimization names the formats that can carry it
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss optimize in.png -o out.png --mode lossy
      - assert:
          exit_code: 1
          stderr:
            contains:
              - "lossy optimization requires"
              - "jpeg, webp, or avif"

  - name: a perceptual target is accepted in both documented spellings
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss convert in.png -o photo.jpg --quality 95
      - assert:
          exit_code: 0
      - run:
          command: truss optimize photo.jpg -o ssim.jpg --target-quality ssim:0.98
      - assert:
          exit_code: 0
          image:
            path: ssim.jpg
            format: jpeg
      - run:
          command: truss optimize photo.jpg -o psnr.jpg --target-quality psnr:42
      - assert:
          exit_code: 0
          image:
            path: psnr.jpg
            format: jpeg

  - name: a malformed perceptual target shows the shape it wanted
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss optimize in.png -o out.jpg --target-quality bogus
      - assert:
          exit_code: 1
          stderr:
            contains: "ssim:0.98"

  # Every other named value in the vocabulary is written one way, so the metric is too.
  - name: a metric in the wrong case is refused like any other unknown name
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss optimize in.png -o out.jpg --target-quality SSIM:0.98
      - assert:
          exit_code: 1
          stderr:
            contains: "unsupported target quality metric `SSIM`"
      - run:
          command: truss optimize in.png -o ok.jpg --target-quality ssim:0.98
      - assert:
          exit_code: 0

  - name: optimizing an SVG into an SVG has nothing to optimize and says so
    steps:
      - fixture:
          file: in.svg
          from: ${fixtures}/svg-minimal.svg
      - run:
          command: truss optimize in.svg -o out.svg
      - assert:
          exit_code: 1
          stderr:
            contains: "optimization is not supported for svg output"

  - name: optimize reads stdin and writes stdout
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss optimize - -o - --format webp
          stdin:
            file: in.png
          stdout_to: out.webp
      - assert:
          exit_code: 0
          image:
            path: out.webp
            format: webp
            width: 16
            height: 16

  - name: no mode returns more bytes than it was given
    steps:
      # "optimize" is a promise about size. flat.jpg was written by an encoder with
      # optimized Huffman tables, which is what a file from a design tool or a phone looks
      # like, and re-encoding it costs more than it saves — so every mode has to notice
      # that the input is already the smallest answer it has.
      - run:
          command: truss optimize "${fixtures}/flat.jpg" -o auto.jpg --mode auto
      - assert:
          exit_code: 0
          file:
            path: auto.jpg
            max_size: 1653
      - run:
          command: truss optimize "${fixtures}/flat.jpg" -o lossless.jpg --mode lossless
      - assert:
          exit_code: 0
          file:
            path: lossless.jpg
            max_size: 1653
      - run:
          command: truss optimize "${fixtures}/flat.jpg" -o lossy.jpg --mode lossy
      - assert:
          exit_code: 0
          file:
            path: lossy.jpg
            max_size: 1653

  - name: no mode returns more bytes than it was given for a WebP either
    steps:
      # The same promise in the other container the passthrough can return. The lossless
      # WebP encoder truss reaches through the image crate is a plain one, so a picture
      # libwebp compressed well came back two and a half times its size — 94 bytes in, 234
      # out — with nothing said about it.
      - run:
          command: truss optimize "${fixtures}/libwebp-lossless.webp" -o auto.webp --mode auto
      - assert:
          exit_code: 0
          file:
            path: auto.webp
            max_size: 94
      - run:
          command: truss optimize "${fixtures}/libwebp-lossless.webp" -o lossless.webp --mode lossless
      - assert:
          exit_code: 0
          file:
            path: lossless.webp
            max_size: 94
      - run:
          command: truss optimize "${fixtures}/libwebp-lossless.webp" -o lossy.webp --mode lossy
      - assert:
          exit_code: 0
          file:
            path: lossy.webp
            max_size: 94

  - name: naming a quality asks for that encode, so lossy re-encodes
    steps:
      - run:
          command: truss optimize "${fixtures}/flat.jpg" -o forced.jpg --mode lossy --quality 98
      - assert:
          exit_code: 0
          file:
            path: forced.jpg
            min_size: 1654

  - name: optimize without an output says which flag is missing
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - run:
          command: truss optimize in.png
      - assert:
          exit_code: 1
          stderr:
            contains:
              - "requires -o <output>"
              - "truss optimize input.jpg -o output.jpg"

  - name: a target the quality cap cannot reach is reported, not passed off as met
    steps:
      # icc-profile.jpg is a 64x64 gradient, which quality 5 cannot hold to 60 dB. The cap
      # and the target came from the same command line, and the cap wins; the warning names
      # the target and the score the encode did reach so the caller can tell which to move.
      - run:
          command: truss optimize "${fixtures}/icc-profile.jpg" -o capped.jpg --mode lossy --quality 5 --target-quality psnr:60
      - assert:
          exit_code: 0
          stderr:
            contains:
              - "warning:"
              - "did not reach psnr:60"
              - "quality cap of 5"
          image:
            path: capped.jpg
            format: jpeg

  - name: a target the search does reach is met without a word
    steps:
      - run:
          command: truss optimize "${fixtures}/icc-profile.jpg" -o reached.jpg --mode lossy --quality 90 --target-quality psnr:30
      - assert:
          exit_code: 0
          stderr:
            not_contains: "warning:"
          image:
            path: reached.jpg
            format: jpeg

  - name: auto keeps a named target even when meeting it costs more than the default encode
    steps:
      # The 64x64 gradient resized to 32 wide comes out of an untargeted auto at about 670
      # bytes and needs about 880 to reach 50 dB. auto used to keep whichever was smaller,
      # which threw the target away; the untargeted size is the floor this pins above.
      - run:
          command: truss convert "${fixtures}/icc-profile.jpg" -o targeted.jpg --width 32 --optimize auto --target-quality psnr:50
      - assert:
          exit_code: 0
          stderr:
            not_contains: "warning:"
          image:
            path: targeted.jpg
            format: jpeg
            width: 32
          file:
            path: targeted.jpg
            min_size: 800

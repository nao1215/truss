# Migrated from ShellSpec integration/cli/spec/convert_spec.sh.
# The convert command transforms images between formats, resizes them, and
# applies other transformations. It is the primary command of truss.
#
#   truss convert <INPUT> -o <OUTPUT> [OPTIONS]
#   truss <INPUT> -o <OUTPUT> [OPTIONS]          (implicit convert)
#   truss convert - -o - --format <FMT>          (stdin/stdout)
#
# The ShellSpec is_jpeg/is_png magic-byte helpers become atago's `image`
# assertion, which decodes the file for real. ${fixtures} comes from
# atago.project.yaml and outputs use relative paths inside the isolated
# per-scenario workdir. Run with: e2e/run.sh
version: "1"

suite:
  name: truss convert

scenarios:
  - name: converts PNG to JPEG and produces a valid JPEG
    steps:
      - run:
          command: truss convert "${fixtures}/sample.png" -o out.jpg
      - assert:
          exit_code: 0
          image:
            path: out.jpg
            format: jpeg

  - name: resizes to a target width of 2
    steps:
      - run:
          command: truss convert "${fixtures}/sample.png" -o w2.png --width 2
      - assert:
          exit_code: 0
          image:
            path: w2.png
            format: png
            width: 2

  - name: optimizes PNG losslessly via the optimize subcommand
    steps:
      - run:
          command: truss optimize "${fixtures}/sample.png" -o optimized.png --mode lossless
      - assert:
          exit_code: 0
          image:
            path: optimized.png
            format: png

  - name: converts without the convert keyword (implicit subcommand)
    steps:
      - run:
          command: truss "${fixtures}/sample.png" -o implicit.jpg
      - assert:
          exit_code: 0
          image:
            path: implicit.jpg
            format: jpeg

  - name: reads from stdin (-) and writes to a file
    steps:
      - fixture:
          file: in.png
          from: ${fixtures}/sample.png
      # `stdin.file` feeds the bytes without a shell, so the pipe is the same on
      # Linux, macOS, and Windows rather than a `cat` that only two of them have.
      - run:
          command: truss convert - -o piped.png --format png
          stdin:
            file: in.png
      - assert:
          exit_code: 0
          image:
            path: piped.png
            format: png

  - name: reads from stdin and writes to stdout
    steps:
      - fixture:
          file: in.png
          from: ${fixtures}/sample.png
      - run:
          command: truss convert - -o - --format png
          stdin:
            file: in.png
          stdout_to: stdout.png
      - assert:
          exit_code: 0
          image:
            path: stdout.png
            format: png

  - name: exits 1 with error, usage, and hint when --output is missing
    steps:
      - run:
          command: truss convert "${fixtures}/sample.png"
      - assert:
          exit_code: 1
          stderr:
            contains:
              - "error:"
              - "usage:"
              - "hint:"

  - name: exits 1 when an unknown option is given
    steps:
      - run:
          command: truss convert --badopt foo
      - assert:
          exit_code: 1
          stderr:
            contains: "error:"

  - name: treats -- as end-of-options (double dash)
    steps:
      # The file -input.png does not exist, but truss should NOT treat it as
      # an option — it should fail with the I/O error code, not unknown-option.
      - run:
          command: truss convert -o dd.jpg -- -input.png
      - assert:
          exit_code: 2
          stderr:
            contains: "error:"

  - name: SVG output from a raster input says which rule it broke
    steps:
      # `truss diagram.svg -o safe.svg` is documented and works, so "unsupported output
      # media type: image/svg+xml" left the reader with a rule they had already seen
      # succeed. The message now names the condition instead of the media type.
      - run:
          command: truss convert "${fixtures}/sample.png" -o out.svg
      - assert:
          exit_code: 4
          stderr:
            contains:
              - "svg output requires an svg input"
              - "png, jpeg, webp, or avif"
      - run:
          command: truss convert "${fixtures}/sample.png" -o out.png --format svg
      - assert:
          exit_code: 4
          stderr:
            contains: "svg output requires an svg input"

  - name: --url requires an http or https URL
    steps:
      # A file:// URL would turn --url into an arbitrary local file read, so it is
      # refused at the flag rather than resolved and then denied.
      - run:
          command: truss convert --url file:///etc/passwd -o out.png
      - assert:
          exit_code: 1
          stderr:
            contains:
              - "requires an http:// or https:// URL"
              - "file:///etc/passwd"
      - run:
          command: truss convert --url example.com/a.png -o out.png
      - assert:
          exit_code: 1
          stderr:
            contains: "is not a valid URL"

  - name: --url and a file argument are not both accepted
    steps:
      - run:
          command: truss convert "${fixtures}/sample.png" --url https://example.com/a.png -o out.png
      - assert:
          exit_code: 1
          stderr:
            contains: "exactly one input"

  # The output is replaced through a temporary file so a write that fails partway cannot
  # leave a half-written image where a whole one was. The temporary file must be gone
  # afterwards: `created: []` is what says the directory holds nothing but the output.
  - name: replacing an existing output leaves nothing beside it
    steps:
      - fixture:
          file: in.png
          from: testdata/sample.png
      - fixture:
          file: out.png
          from: testdata/sample.png
      - run:
          command: truss convert in.png -o out.png --width 2
      - assert:
          exit_code: 0
          changes:
            created: []
            modified:
              - out.png
            deleted: []
          image:
            path: out.png
            format: png
            width: 2

# Migrated from ShellSpec integration/cli/spec/convert_spec.sh.
# The convert command transforms images between formats, resizes them, and
# applies other transformations. It is the primary command of truss.
#
#   truss convert <INPUT> -o <OUTPUT> [OPTIONS]
#   truss <INPUT> -o <OUTPUT> [OPTIONS]          (implicit convert)
#   truss convert - -o - --format <FMT>          (stdin/stdout)
#
# The ShellSpec is_jpeg/is_png magic-byte helpers become atago's `image`
# assertion, which decodes the file for real. $FIXTURES_DIR is exported by
# e2e/run.sh (shell: true expands it); outputs use relative paths inside the
# isolated per-scenario workdir. Run with: e2e/run.sh
version: "1"

suite:
  name: truss convert

scenarios:
  - name: converts PNG to JPEG and produces a valid JPEG
    steps:
      - run:
          shell: true
          command: truss convert "$FIXTURES_DIR/sample.png" -o out.jpg
      - assert:
          exit_code: 0
          image:
            path: out.jpg
            format: jpeg

  - name: resizes to a target width of 2
    steps:
      - run:
          shell: true
          command: truss convert "$FIXTURES_DIR/sample.png" -o w2.png --width 2
      - assert:
          exit_code: 0
          image:
            path: w2.png
            format: png
            width: 2

  - name: optimizes PNG losslessly via the optimize subcommand
    steps:
      - run:
          shell: true
          command: truss optimize "$FIXTURES_DIR/sample.png" -o optimized.png --mode lossless
      - assert:
          exit_code: 0
          image:
            path: optimized.png
            format: png

  - name: converts without the convert keyword (implicit subcommand)
    steps:
      - run:
          shell: true
          command: truss "$FIXTURES_DIR/sample.png" -o implicit.jpg
      - assert:
          exit_code: 0
          image:
            path: implicit.jpg
            format: jpeg

  - name: reads from stdin (-) and writes to a file
    steps:
      - run:
          shell: true
          command: cat "$FIXTURES_DIR/sample.png" | truss convert - -o piped.png --format png
      - assert:
          exit_code: 0
          image:
            path: piped.png
            format: png

  - name: reads from stdin and writes to stdout
    steps:
      - run:
          shell: true
          command: cat "$FIXTURES_DIR/sample.png" | truss convert - -o - --format png > stdout.png
      - assert:
          exit_code: 0
          image:
            path: stdout.png
            format: png

  - name: exits 1 with error, usage, and hint when --output is missing
    steps:
      - run:
          shell: true
          command: truss convert "$FIXTURES_DIR/sample.png"
      - assert:
          exit_code: 1
          stderr:
            contains:
              - "error:"
              - "usage:"
              - "hint:"

  - name: exits 1 when an unknown option is given
    steps:
      - run:
          command: truss convert --badopt foo
      - assert:
          exit_code: 1
          stderr:
            contains: "error:"

  - name: treats -- as end-of-options (double dash)
    steps:
      # The file -input.png does not exist, but truss should NOT treat it as
      # an option — it should fail with the I/O error code, not unknown-option.
      - run:
          command: truss convert -o dd.jpg -- -input.png
      - assert:
          exit_code: 2
          stderr:
            contains: "error:"

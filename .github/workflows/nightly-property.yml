name: Nightly properties

# The property and metamorphic tests run on every pull request with proptest's
# default of 256 cases each, as part of `cargo test`. This workflow runs the same
# tests each night with many more cases, in release mode so a case costs little.
#
# proptest draws a fresh seed every run and prints the minimal failing input when
# a property breaks. Turn that input into a plain unit test beside the property,
# then fix it on a fix/* branch. Never lower the case count to make this green.

on:
  workflow_dispatch:
    inputs:
      cases:
        description: Cases per property
        default: "20000"
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Unit properties
        env:
          PROPTEST_CASES: ${{ inputs.cases || '20000' }}
        run: cargo test --locked --release --lib properties

      - name: Metamorphic relations
        env:
          PROPTEST_CASES: ${{ inputs.cases || '20000' }}
        run: cargo test --locked --release --test transform_metamorphic

name: Release

on:
  push:
    tags:
      - "v*"

# One release per tag at a time, and never cancel one midway: a half-run
# release leaves crates.io, npm, GHCR and the GitHub Release out of step.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# Least privilege by default; jobs opt into more only where they publish.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Release binaries are built with an explicit compiler rather than whatever
  # `stable` happens to be on the day of the tag. The `verify` job checks this
  # against the crate's rust-version.
  RUST_TOOLCHAIN: "1.98.1"
  # Cargo features every published binary is built with. The release manifest
  # records the transitive closure of these plus the default features.
  RELEASE_FEATURES: "s3,gcs,azure"
  NODE_VERSION: "22"

# Third-party actions below are pinned to full commit SHAs; the trailing
# comment on each `uses:` is the tag that SHA belonged to when it was pinned.

jobs:
  # ── 0. Distribution target matrix ───────────────────────────────────
  # Single source of truth for what the release ships, shared by the build
  # matrix, the manifest generator and the manifest verifier.
  targets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read distribution targets
        id: read
        run: echo "matrix=$(jq -c . .github/release-targets.json)" >> "$GITHUB_OUTPUT"

  # ── 1. Verify tag, run dry-run publish ──────────────────────────────
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Ensure the pinned toolchain satisfies rust-version
        run: node ./scripts/check-rust-toolchain-pin.mjs --toolchain "${RUST_TOOLCHAIN}"

      - name: Ensure tag matches Cargo.toml version
        run: |
          expected_tag="v$(cargo pkgid | sed -E 's/.*@//')"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "::error title=Tag/version mismatch::Expected ${expected_tag} from Cargo.toml, got ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Verify publishable package
        run: cargo publish --locked --dry-run

  # ── 2. Build release binaries ───────────────────────────────────────
  build-binaries:
    needs: [verify, targets]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Install cross-compilation toolchain
        if: matrix.cross && matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --locked --target ${{ matrix.target }} --features "${{ env.RELEASE_FEATURES }}"

      - name: Determine binary path
        id: bin
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            echo "path=target/${{ matrix.target }}/release/truss.exe" >> "$GITHUB_OUTPUT"
          else
            echo "path=target/${{ matrix.target }}/release/truss" >> "$GITHUB_OUTPUT"
          fi

      - name: Strip binary (Linux/macOS)
        if: runner.os != 'Windows' && !matrix.cross
        run: strip ${{ steps.bin.outputs.path }}

      - name: Strip binary (cross aarch64)
        if: matrix.cross && matrix.target == 'aarch64-unknown-linux-gnu'
        run: aarch64-linux-gnu-strip ${{ steps.bin.outputs.path }}

      # A glibc binary runs only where the C library is at least as new as the
      # newest GLIBC_x.y symbol version it links. v0.25.0 was built on Ubuntu
      # 24.04, needed GLIBC_2.39, and did not start in the debian:bookworm-slim
      # image (glibc 2.36) the container ships, nor on Debian 12 or Ubuntu
      # 22.04. The Linux targets build on Ubuntu 22.04, and this step fails the
      # release if a binary needs anything newer than that system's glibc.
      # MAX_GLIBC must also stay at or below the glibc of the base image in
      # Dockerfile.release.
      - name: Check the glibc the binary requires
        if: endsWith(matrix.target, '-linux-gnu')
        env:
          MAX_GLIBC: "2.35"
        run: |
          set -o pipefail
          need="$(objdump -T "${{ steps.bin.outputs.path }}" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sed 's/^GLIBC_//' | sort -uV | tail -n 1)"
          test -n "${need}"
          highest="$(printf '%s\n%s\n' "${need}" "${MAX_GLIBC}" | sort -V | tail -n 1)"
          if [ "${highest}" != "${MAX_GLIBC}" ]; then
            echo "::error title=glibc too new::${{ matrix.target }} requires GLIBC_${need}, the release allows up to ${MAX_GLIBC}"
            exit 1
          fi
          echo "${{ matrix.target }} requires GLIBC_${need} (allowed up to ${MAX_GLIBC})"

      - name: Create archive
        shell: bash
        run: |
          archive="truss-${GITHUB_REF_NAME}-${{ matrix.target }}.${{ matrix.archive }}"
          ./scripts/pack-release-archive.sh "${{ steps.bin.outputs.path }}" "${archive}"
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      # Structural check on every target, plus `truss --version` on the ones
      # this runner can execute. Cross-compiled artifacts are checked for
      # layout, permissions and ownership only.
      - name: Check archive
        shell: bash
        run: |
          node ./scripts/check-release-archive.mjs \
            --archive "${ARCHIVE}" \
            --target "${{ matrix.target }}" \
            --tag "${GITHUB_REF_NAME}" \
            ${{ matrix.executable && '--exec' || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  # ── 3. Release manifest, checksums, and whole-release verification ──
  # Every SHA-256 in the release is computed here, once. checksums.txt is
  # rendered from the manifest so the two cannot disagree.
  release-artifacts:
    needs: [targets, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Generate release manifest and checksums
        run: |
          node ./scripts/generate-release-manifest.mjs \
            --dir release-assets \
            --tag "${GITHUB_REF_NAME}" \
            --repository "${GITHUB_REPOSITORY}" \
            --features "${RELEASE_FEATURES}"

      - name: Verify release artifacts against the manifest
        run: |
          node ./scripts/verify-release-manifest.mjs \
            --dir release-assets \
            --tag "${GITHUB_REF_NAME}" \
            --repository "${GITHUB_REPOSITORY}" \
            --exec-target x86_64-unknown-linux-gnu

      - name: Upload release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: |
            release-assets/release-manifest.json
            release-assets/checksums.txt

  # ── 4. CycloneDX SBOM ───────────────────────────────────────────────
  build-sbom:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate CycloneDX SBOM
        run: |
          cargo cyclonedx \
            --format json \
            --all-features \
            --target all \
            --spec-version 1.5 \
            --override-filename "truss-${GITHUB_REF_NAME}-sbom.cdx"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: truss-${{ github.ref_name }}-sbom.cdx.json

  # ── 4b. Third-party license texts ──────────────────────────────────
  # MIT, Apache-2.0 and BSD ask a binary distribution to carry their texts.
  # about.toml accepts exactly what deny.toml allows, and --fail stops the
  # release on anything else. Generated for the features the binaries ship.
  licenses:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Write the third-party licenses
        run: |
          out="truss-${GITHUB_REF_NAME}-THIRD_PARTY_LICENSES.html"
          cargo about generate --locked --fail --features "${RELEASE_FEATURES}" about.hbs -o "${out}"
          test -s "${out}"

      - name: Upload license artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: licenses
          path: truss-*-THIRD_PARTY_LICENSES.html
          if-no-files-found: error

  # ── 5. Publish crate to crates.io ───────────────────────────────────
  publish-crate:
    runs-on: ubuntu-latest
    # After verify-release: a version on crates.io cannot be taken back, so it
    # goes out only once the signed release has been checked.
    needs: [verify, release-artifacts, verify-release]
    permissions:
      contents: read
      id-token: write
    env:
      HAS_CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Authenticate to crates.io with trusted publishing
        if: env.HAS_CARGO_REGISTRY_TOKEN == 'false'
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate with API token
        if: env.HAS_CARGO_REGISTRY_TOKEN == 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish crate with trusted publishing
        if: env.HAS_CARGO_REGISTRY_TOKEN == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

  build-wasm-package:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Read Wasm package config
        id: wasm-package-config
        run: |
          version="$(node -p "require('./packages/truss-wasm/package.json').trussWasmBuild.wasmBindgenVersion")"
          echo "wasm_bindgen_version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen CLI
        run: |
          version="${{ steps.wasm-package-config.outputs.wasm_bindgen_version }}"
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen ${version}" ]; then
            cargo install wasm-bindgen-cli --version "${version}"
          fi

      - name: Pack npm Wasm package
        run: |
          cd packages/truss-wasm
          npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-truss-wasm
          path: packages/truss-wasm/*.tgz

  build-url-signer-package:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify TypeScript URL signer package version metadata
        run: |
          cd packages/truss-url-signer
          npm run check:version

      - name: Compile-check TypeScript URL signer package definitions
        run: |
          cd packages/truss-url-signer
          npm run typecheck

      - name: Test TypeScript URL signer package
        run: |
          cd packages/truss-url-signer
          npm test

      - name: Pack npm TypeScript URL signer package
        run: |
          cd packages/truss-url-signer
          npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-truss-url-signer
          path: packages/truss-url-signer/*.tgz

  publish-url-signer-package:
    needs: [build-url-signer-package, release-artifacts, verify-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Download npm TypeScript URL signer package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-truss-url-signer
          path: npm-release

      - name: Publish npm TypeScript URL signer package
        run: npm publish --access public ./npm-release/*.tgz

  publish-wasm-package:
    needs: [build-wasm-package, release-artifacts, verify-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Download npm Wasm package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-truss-wasm
          path: npm-release

      - name: Publish npm Wasm package
        run: npm publish --access public ./npm-release/*.tgz

  publish-homebrew-formula:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') && !contains(github.ref_name, '+')
    needs: [create-release, verify-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HOMEBREW_TAP_TOKEN_CONFIGURED: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN != '' }}
    steps:
      - name: Ensure Homebrew tap token is configured
        if: env.HOMEBREW_TAP_TOKEN_CONFIGURED != 'true'
        run: |
          echo "::error title=Missing Homebrew tap token::Configure HOMEBREW_TAP_GITHUB_TOKEN to update nao1215/homebrew-tap."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
          path: homebrew-assets

      # The formula reads its URLs and hashes out of the same manifest the
      # release publishes, so Homebrew cannot drift from checksums.txt.
      - name: Render Homebrew formula
        run: |
          node ./scripts/render-homebrew-formula.mjs \
            "${GITHUB_REF_NAME}" \
            homebrew-assets/release-manifest.json \
            > truss.rb

      - name: Syntax-check Homebrew formula
        run: ruby -c truss.rb

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nao1215/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Update Homebrew formula
        run: mv truss.rb homebrew-tap/truss.rb

      - name: Commit and push Homebrew formula
        run: |
          cd homebrew-tap
          if [ -z "$(git status --short -- truss.rb)" ]; then
            echo "No Homebrew formula changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add truss.rb
          git commit -m "Update truss formula for ${GITHUB_REF_NAME}"
          git push

      - name: Upload Homebrew formula artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula-truss
          path: homebrew-tap/truss.rb

  verify-homebrew-install:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') && !contains(github.ref_name, '+')
    needs: [create-release, publish-homebrew-formula]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Install truss from Homebrew tap
        run: brew install nao1215/tap/truss

      - name: Verify installed truss version
        run: truss --version

      - name: Run Homebrew formula test
        run: brew test nao1215/tap/truss

  # ── 6. Build & push container image ─────────────────────────────────
  publish-container:
    runs-on: ubuntu-latest
    needs: [verify-release, build-binaries, licenses]
    # id-token signs the image with cosign and the attestation with the
    # workflow's identity; attestations stores the attestation.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download x86_64 Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-x86_64-unknown-linux-gnu
          path: binaries

      - name: Download aarch64 Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-aarch64-unknown-linux-gnu
          path: binaries

      - name: Download the third-party licenses
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: licenses
          path: licenses

      - name: Prepare platform binaries
        run: |
          mkdir -p context-amd64 context-arm64
          cp licenses/truss-*-THIRD_PARTY_LICENSES.html context-amd64/THIRD_PARTY_LICENSES.html
          cp licenses/truss-*-THIRD_PARTY_LICENSES.html context-arm64/THIRD_PARTY_LICENSES.html
          tar xzf binaries/truss-*-x86_64-unknown-linux-gnu.tar.gz -C context-amd64
          tar xzf binaries/truss-*-aarch64-unknown-linux-gnu.tar.gz -C context-arm64
          chmod +x context-amd64/truss context-arm64/truss
          cp Dockerfile.release context-amd64/Dockerfile
          cp Dockerfile.release context-arm64/Dockerfile

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # Start each image before anything is pushed. The archive check runs the
      # binary on the runner that built it, which cannot notice that the
      # image's base has an older C library than the binary needs.
      - name: Smoke-test the images
        run: |
          for arch in amd64 arm64; do
            docker build --platform "linux/${arch}" -t "truss-smoke:${arch}" "context-${arch}"
            docker run --rm --platform "linux/${arch}" --entrypoint /truss "truss-smoke:${arch}" --version
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context-amd64
          file: context-amd64/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}-amd64
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context-arm64
          file: context-arm64/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}-arm64
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create and push multi-arch manifest
        run: |
          IMAGE="${{ steps.image.outputs.name }}"
          TAGS=(${{ steps.meta.outputs.tags }})
          args=()
          for t in "${TAGS[@]}"; do
            args+=(-t "${t}")
          done
          docker buildx imagetools create "${args[@]}" \
            "${IMAGE}:${{ github.ref_name }}-amd64" \
            "${IMAGE}:${{ github.ref_name }}-arm64"

      - name: Read the multi-arch image digest
        id: digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        # metadata-action tags the multi-arch image with the version without
        # the tag's leading v (0.26.1, 0.26, latest), not with the tag itself.
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME#v}" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The digest, not a tag, is signed: a tag can be moved to another image.
      - name: Sign the image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest the image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  # ── 7. Assemble, verify and sign what the release will publish ─────
  # Everything is prepared before the release exists: GitHub Releases in this
  # repository are immutable, so an asset cannot be added after publishing
  # (v0.26.1 lost its SLSA provenance that way). The directory is handed to
  # create-release, which publishes it together with the provenance at once.
  prepare-release:
    runs-on: ubuntu-latest
    needs:
      - release-artifacts
      - build-sbom
      - licenses
      - build-wasm-package
      - build-url-signer-package
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Download release manifest and checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
          path: release-assets

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: release-assets

      - name: Download the third-party licenses
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: licenses
          path: release-assets

      - name: Download npm package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: npm-package-*
          path: release-assets
          merge-multiple: true

      # Re-run the verification against the exact directory that is uploaded,
      # so nothing reaches the release without passing it.
      - name: Verify release assets before upload
        run: |
          node ./scripts/verify-release-manifest.mjs \
            --dir release-assets \
            --tag "${GITHUB_REF_NAME}" \
            --repository "${GITHUB_REPOSITORY}" \
            --exec-target x86_64-unknown-linux-gnu

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the certificate names this workflow and the tag. Signed before
      # the release is created, so a failure here leaves no unsigned release.
      - name: Sign checksums.txt
        working-directory: release-assets
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt

      # Subjects for the SLSA provenance: everything the release publishes
      # except the signature and the provenance itself.
      - name: Hash the release assets for the provenance
        id: hashes
        working-directory: release-assets
        run: |
          set -o pipefail
          echo "hashes=$(sha256sum -- truss-* release-manifest.json checksums.txt nao1215-*.tgz | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/truss-*.tar.gz
            release-assets/truss-*.zip
            release-assets/release-manifest.json
            release-assets/truss-*-sbom.cdx.json

      - name: Extract tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        run: |
          tag="${{ steps.tag.outputs.TAG_NAME }}"
          version="${tag#v}"
          changelog_file="release_notes.md"

          if [ -f CHANGELOG.md ]; then
            awk -v tag="$tag" -v version="$version" '
              BEGIN { found = 0 }
              $0 ~ "^#{2,3} \\[?" tag "\\]?$" { found = 1; next }
              $0 ~ "^#{2,3} \\[?" version "\\]?$" { found = 1; next }
              /^#{2,3} \[?v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?\]?$/ { if (found) exit }
              found { print }
            ' CHANGELOG.md > "$changelog_file"
          else
            echo "::warning::CHANGELOG.md not found, using default release notes"
          fi

          if [ ! -s "$changelog_file" ]; then
            echo "- Release $tag" > "$changelog_file"
          fi

          {
            echo "BODY<<EOF"
            cat "$changelog_file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write the release notes file
        env:
          BODY: ${{ steps.changelog.outputs.BODY }}
        run: printf '%s\n' "${BODY}" > release-notes.md

      - name: Upload the release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: |
            release-assets/
            release-notes.md
          if-no-files-found: error

  # ── 8. SLSA provenance ──────────────────────────────────────────────
  # truss-<tag>.intoto.jsonl for everything prepare-release hashed. It is kept
  # as a workflow artifact and published by create-release, since assets
  # cannot be added to an immutable release afterwards. The reusable workflow
  # must be referenced by tag: slsa-verifier checks the tag the provenance names.
  provenance:
    needs: prepare-release
    # contents: write although nothing is uploaded here: the generator's own
    # upload job declares it, and a called workflow may not ask for more than
    # the caller grants, so contents: read stops the whole run at startup.
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.prepare-release.outputs.hashes }}
      provenance-name: truss-${{ github.ref_name }}.intoto.jsonl
      upload-assets: false

  # ── 9. Create GitHub Release ────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    needs: [prepare-release, provenance]
    permissions:
      contents: write
    steps:
      - name: Download the release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: bundle

      - name: Download the SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: bundle/release-assets

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: bundle/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          files: bundle/release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 10. Verify the published release as a user would ────────────────
  # Nothing is published to crates.io, npm or GHCR before this passes.
  verify-release:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release

      - name: Verify the checksums and their signature
        working-directory: release
        run: |
          sha256sum --check checksums.txt
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt

      - name: Verify the SLSA provenance and the attestations
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in truss-*.tar.gz truss-*.zip; do
            slsa-verifier verify-artifact "${f}" \
              --provenance-path "truss-${GITHUB_REF_NAME}.intoto.jsonl" \
              --source-uri "github.com/${GITHUB_REPOSITORY}" \
              --source-tag "${GITHUB_REF_NAME}"
            gh attestation verify "${f}" --repo "${GITHUB_REPOSITORY}"
          done

  # ── 11. Verify the pushed image as a user would ────────────────────
  verify-container:
    needs: publish-container
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify the container image signature
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${image}"

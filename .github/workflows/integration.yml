name: Integration Tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "integration/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/integration.yml"
  pull_request:
    paths:
      - "src/**"
      - "integration/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/integration.yml"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build truss image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: truss:local
          cache-from: type=gha,scope=integration-build
          cache-to: type=gha,mode=max,scope=integration-build
          outputs: type=docker,dest=/tmp/truss.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: truss-image
          path: /tmp/truss.tar
          retention-days: 1

  integration:
    needs: build-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, s3, gcs, azure]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: truss-image
          path: /tmp

      - run: docker load -i /tmp/truss.tar

      - name: Run ${{ matrix.service }} integration tests
        run: |
          cd integration/${{ matrix.service }}
          docker compose up --no-build --abort-on-container-exit --exit-code-from runn
        timeout-minutes: 10
        env:
          TRUSS_IMAGE: truss:local

      - name: Cleanup
        if: always()
        run: |
          cd integration/${{ matrix.service }}
          docker compose down --volumes --remove-orphans

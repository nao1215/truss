# CodeQL static analysis for the Rust code and the GitHub Actions workflows.
# Free for public repositories. Scorecard's SAST check counts merged PRs that
# CodeQL checked, so it runs on pull requests as well as on main.
# Before adding this file, check that code scanning's default setup is not
# configured (gh api repos/nao1215/<repo>/code-scanning/default-setup --jq .state):
# default setup and an advanced workflow cannot coexist.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-mode none: CodeQL reads the Rust sources without compiling them,
      # so the job does not need the toolchain, the features or system libraries.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

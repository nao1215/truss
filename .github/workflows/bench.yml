name: Benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The truss CLI is measured end to end with himorime, from
# bench/himorime.yaml.
#
# On a pull request, `himorime ci` checks the base of the pull request out
# into a temporary worktree, builds it and the head, and measures both in
# interleaved rounds on this runner, so a noisy neighbour slows both
# revisions instead of one. The job fails when the head is slower, uses
# more CPU time or more memory than the base beyond the tolerance of the
# suite with 95% confidence; a difference too close to call is
# inconclusive and does not fail it. The comparison is written to the job
# summary.
#
# Started by hand, the job measures the ref it runs on without comparing.
jobs:
  bench:
    runs-on: ubuntu-latest
    # Two release builds (thin LTO, one codegen unit): the base worktree
    # does not share the head's incremental state.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit must exist locally for the temporary worktree.
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: nao1215/setup-himorime@14aeeb3fe55ad42cf29ee0802d578820faac3897 # v0.1.2
        with:
          version: v0.5.2
      - name: Compare the base with the head
        if: github.event_name == 'pull_request'
        run: himorime ci --output "$RUNNER_TEMP/himorime.json" --format json bench
      - name: Measure
        if: github.event_name != 'pull_request'
        run: himorime run --output "$RUNNER_TEMP/himorime.json" --format json --summary "$GITHUB_STEP_SUMMARY" bench
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: himorime-report
          path: ${{ runner.temp }}/himorime.json
          retention-days: 7

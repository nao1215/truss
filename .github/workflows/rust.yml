name: Build/Test/Lint

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "fuzz/fuzz_targets/css_oracle.rs"
      - "benches/**"
      - "examples/**"
      - "packages/**"
      - "scripts/**"
      - "docs/openapi.yaml"
      - "justfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/release-targets.json"
      - ".github/workflows/release.yml"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "fuzz/fuzz_targets/css_oracle.rs"
      - "benches/**"
      - "examples/**"
      - "packages/**"
      - "scripts/**"
      - "docs/openapi.yaml"
      - "justfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/release-targets.json"
      - ".github/workflows/release.yml"
      - ".github/workflows/rust.yml"

# Every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Always: Ubuntu test + lint (PR and main) ────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install nextest
        # A release tag plus the tool input, not the `nextest` branch: Dependabot
        # reads a branch name as a version and rewrote the pin to a commit
        # without nextest.
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: nextest@0.9.146

      - name: Run tests
        run: cargo nextest run --all-features --all-targets

      - name: Run doc tests
        run: cargo test --all-features --doc

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm-package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Read Wasm package config
        id: wasm-package-config
        shell: bash
        run: |
          version="$(node -p "require('./packages/truss-wasm/package.json').trussWasmBuild.wasmBindgenVersion")"
          echo "wasm_bindgen_version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen CLI
        shell: bash
        run: |
          version="${{ steps.wasm-package-config.outputs.wasm_bindgen_version }}"
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen ${version}" ]; then
            cargo install wasm-bindgen-cli --version "${version}"
          fi

      - name: Verify TypeScript URL signer package version metadata
        run: cd packages/truss-url-signer && npm run check:version

      - name: Compile-check TypeScript URL signer package definitions
        run: cd packages/truss-url-signer && npm run typecheck

      - name: Test TypeScript URL signer package
        run: cd packages/truss-url-signer && npm test

      - name: Pack TypeScript URL signer package
        run: cd packages/truss-url-signer && npm pack --dry-run

      - name: Pack npm Wasm package
        run: cd packages/truss-wasm && npm pack --dry-run

      - name: Run Wasm consumer smoke test
        run: node ./scripts/run-wasm-consumer-smoke.mjs

      - name: Run Vite Wasm example smoke test
        run: node ./scripts/run-wasm-vite-example-smoke.mjs

      - name: Run Vite example runtime smoke test
        if: runner.os == 'Linux'
        run: node ./scripts/run-wasm-vite-example-runtime-smoke.mjs

  # ── Release distribution tooling ───────────────────────────────────
  # Covers the release manifest generator and verifier without needing a tag:
  # the end-to-end test packs stand-in executables with the same script the
  # release workflow uses, then generates and verifies a manifest over them.
  release-scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Run on all three runner families: the packing script takes a different
      # branch for GNU tar, bsdtar and ZIP, and each release job exercises only
      # the branch its own runner has.
      - name: Test release manifest tooling
        run: node --test scripts/lib/release-manifest.test.mjs scripts/lib/version-copies.test.mjs scripts/release-artifacts.test.mjs

      - name: Check the pinned release toolchain against rust-version
        if: runner.os == 'Linux'
        run: |
          toolchain="$(grep -oP '^\s*RUST_TOOLCHAIN:\s*"\K[^"]+' .github/workflows/release.yml)"
          node ./scripts/check-rust-toolchain-pin.mjs --toolchain "${toolchain}"

  # ── Next.js example smoke test ─────────────────────────────────────
  nextjs-example:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run Next.js example smoke test
        run: node ./scripts/run-nextjs-example-smoke.mjs

  # ── Cross-platform tests (PR and main) ──────────────────────────────
  test-cross-platform:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install nextest
        # A release tag plus the tool input, not the `nextest` branch: Dependabot
        # reads a branch name as a version and rewrote the pin to a commit
        # without nextest.
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: nextest@0.9.146

      - name: Run tests
        run: cargo nextest run --all-targets

      - name: Run doc tests
        run: cargo test --doc

  # ── Minimum supported Rust version ─────────────────────────
  # Every other job installs `stable`, so nothing here noticed when the crate or
  # one of its dependencies started needing a compiler newer than the
  # `rust-version` the manifest declares and the crate root promises. The
  # toolchain is read from the manifest so that raising the MSRV stays one edit.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version="$(grep -oP '^rust-version\s*=\s*"\K[^"]+' Cargo.toml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Tests, not only a check: a build that compiles on the MSRV can still
      # still fail its tests there, and only a test run would show it.
      - name: Test with the declared minimum toolchain
        run: cargo test --locked --all-features --all-targets

  # ── OpenAPI spec validation ─────────────────────────────────────────
  openapi-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install openapi-spec-validator
        run: pip install openapi-spec-validator==0.9.0

      - name: Validate OpenAPI spec
        run: python -m openapi_spec_validator docs/openapi.yaml

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check every copy of the version against the crate's
        run: node ./scripts/check-version-consistency.mjs

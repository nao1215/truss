[package]
name = "truss-image"
version = "0.26.1"
edition = "2024"
rust-version = "1.94.1"
authors = ["CHIKAMATSU Naohiro <n.chika156@gmail.com>"]
description = "Image toolkit with a shared Rust core across the CLI, HTTP server, and WASM demo."
license = "MIT"
readme = "README.md"
repository = "https://github.com/nao1215/truss"
homepage = "https://nao1215.github.io/truss/"
keywords = ["image", "image-processing", "webp", "image-server"]
categories = ["command-line-utilities", "multimedia::images", "web-programming::http-server"]
# The fuzz crate is a separate workspace built on nightly; it is not part of the library.
exclude = ["/fuzz"]

[features]
default = ["cli", "server", "svg", "webp-lossy"]
cli = ["dep:clap", "dep:clap_complete", "dep:ureq", "server"]
server = ["dep:hmac", "dep:hex", "dep:serde_json", "dep:sha2", "dep:subtle", "dep:ureq", "dep:url", "dep:uuid", "dep:libc", "dep:flate2", "svg"]
s3 = ["server", "dep:aws-sdk-s3", "dep:aws-config", "dep:tokio"]
gcs = ["server", "dep:google-cloud-storage", "dep:google-cloud-auth", "dep:tokio"]
azure = ["server", "dep:azure_storage_blob", "dep:azure_core", "dep:futures", "dep:tokio"]
svg = ["dep:quick-xml", "dep:resvg"]
wasm = ["dep:serde_json", "dep:wasm-bindgen"]
webp-lossy = ["dep:webp"]

[[bin]]
name = "truss"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "truss"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
clap_complete = { version = "4", optional = true }
hmac = { version = "0.13.0", optional = true }
hex = { version = "0.4.3", optional = true }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
kamadak-exif = "0.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", optional = true }
sha2 = { version = "0.11.0", optional = true }
subtle = { version = "2", optional = true }
ureq = { version = "3.3.0", optional = true }
url = { version = "2.5.8", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
wasm-bindgen = { version = "0.2.129", optional = true }
webp = { version = "0.3", optional = true }
quick-xml = { version = "0.42", optional = true }
resvg = { version = "0.48", optional = true }
# The default features include `rustls`, the legacy hyper 0.14 / rustls 0.21 client
# (rustls-webpki 0.101, h2 0.3), which has advisories with no fix on that line. The
# client truss uses is `default-https-client`; the rest of the defaults are kept.
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-config = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "time"], optional = true }
google-cloud-storage = { version = "1", optional = true }
google-cloud-auth = { version = "1", optional = true }
azure_storage_blob = { version = "1.0", optional = true }
azure_core = { version = "1.0", optional = true }
futures = { version = "0.3", optional = true }
flate2 = { version = "1", optional = true }
libc = { version = "0.2", optional = true }

# Error handling in the code that ships: an error is returned, reported, or dropped with a
# reason written next to it, and a panic is an invariant stated in an `expect` message.
# `clippy.toml` lets tests unwrap, expect and panic, since there a failure is the test failing.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
bytes = "1"
criterion = { version = "0.8", features = ["html_reports"] }
http = "1"
rustls = { version = "0.23", features = ["ring"] }
rstest = "0.27.0"
serial_test = "3"
tempfile = "3"

[[bench]]
name = "transform"
harness = false

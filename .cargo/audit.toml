[advisories]
# RUSTSEC-2026-0098 / RUSTSEC-2026-0099 / RUSTSEC-2026-0104 (rustls-webpki name-constraint
# handling): rustls-webpki v0.101.7 is pulled in by aws-smithy-http-client via the legacy
# hyper-rustls 0.24 / rustls 0.21 path. The upstream AWS SDK has not yet migrated this
# dependency path to rustls 0.23, so this transitive version cannot be removed from the
# lockfile yet. All three sit behind certificate signature verification and require a
# compromised or misissuing CA to exploit, which truss does not expose through this path.
# Practical risk is therefore low. The modern rustls 0.23 path uses the patched
# rustls-webpki 0.103.13. Remove these once the AWS SDK drops the rustls 0.21 path and the
# lockfile no longer contains rustls-webpki 0.101.x.
#
# RUSTSEC-2026-0258 (h2 < 0.4.16: unbounded empty DATA frames). truss's own h2 is on the
# patched 0.4.19; the remaining unpatched copy is h2 0.3.27, reachable only through
# aws-smithy-http-client -> hyper 0.14 / hyper-rustls 0.24, and the 0.3 line has no patched
# release. The advisory describes an HTTP/2 peer flooding empty DATA frames, which needs an
# untrusted peer on that connection. This path is an outbound client to S3, so the peer is
# the configured AWS endpoint, not an attacker. truss's own inbound server is HTTP/1.1 and
# does not use h2 at all. Remove this once the AWS SDK moves off hyper 0.14.
ignore = [
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0258",
]

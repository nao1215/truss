desc: "Error responses - RFC 9457 problem details"
runners:
  req: http://truss:8080
vars:
  token: "test-token"
steps:
  not_found:
    desc: "GET to an unknown route returns 404 with application/problem+json"
    req:
      /this-route-does-not-exist:
        get:
          body: null
    test: |
      current.res.status == 404
      && current.res.headers['Content-Type'][0] == 'application/problem+json'
      && current.res.body.status == 404
      && current.res.body.title == 'Not Found'
      && current.res.body.type == 'about:blank'
      && current.res.body.requestId == current.res.headers['X-Request-Id'][0]
  wrong_method:
    desc: "GET on the transform endpoint (POST-only) returns 405 with Allow"
    req:
      /images:transform:
        get:
          body: null
    test: |
      current.res.status == 405
      && current.res.headers['Allow'][0] == 'POST, OPTIONS'
      && current.res.headers['Content-Type'][0] == 'application/problem+json'
      && current.res.body.status == 405
      && current.res.body.title == 'Method Not Allowed'
      && current.res.body.type == 'https://github.com/nao1215/truss/blob/main/docs/problems.md#method-not-allowed'
      && current.res.body.requestId == current.res.headers['X-Request-Id'][0]
  transform_wrong_content_type:
    desc: "POST /images:transform without JSON content-type returns 415"
    req:
      /images:transform:
        post:
          headers:
            Authorization: "Bearer {{ vars.token }}"
            Content-Type: "text/plain"
          body:
            text/plain: "not json"
    test: |
      current.res.status == 415
      && current.res.body.type == 'https://github.com/nao1215/truss/blob/main/docs/problems.md#unsupported-media-type'
      && current.res.body.title == 'Unsupported Media Type'
      && current.res.body.requestId == current.res.headers['X-Request-Id'][0]
  transform_invalid_json:
    desc: "POST /images:transform with malformed JSON returns 400"
    req:
      /images:transform:
        post:
          headers:
            Authorization: "Bearer {{ vars.token }}"
            Content-Type: "application/json"
          body:
            application/json:
              unexpected_field: true
    test: |
      current.res.status == 400
      && current.res.body.type == 'https://github.com/nao1215/truss/blob/main/docs/problems.md#invalid-request'
      && current.res.body.title == 'Invalid request'
  transform_invalid_options:
    desc: "fit without both width and height is the transform's own class, invalid-options"
    req:
      /images:transform:
        post:
          headers:
            Authorization: "Bearer {{ vars.token }}"
            Content-Type: "application/json"
          body:
            application/json:
              source:
                kind: path
                path: /sample.png
              options:
                fit: cover
                width: 10
    test: |
      current.res.status == 400
      && current.res.body.type == 'https://github.com/nao1215/truss/blob/main/docs/problems.md#invalid-options'
      && current.res.body.title == 'Invalid transform options'
      && current.res.body.requestId == current.res.headers['X-Request-Id'][0]
  transform_decode_only_output_format:
    desc: "a format truss reads but cannot write is refused from the options, not by the encoder"
    req:
      /images:transform:
        post:
          headers:
            Authorization: "Bearer {{ vars.token }}"
            Content-Type: "application/json"
          body:
            application/json:
              source:
                kind: path
                path: /no-such-file.png
              options:
                format: gif
    test: |
      current.res.status == 415
      && current.res.body.type == 'https://github.com/nao1215/truss/blob/main/docs/problems.md#unsupported-output-media-type'
      && current.res.body.title == 'Unsupported output media type'
  transform_counter_clockwise_rotation:
    desc: "a negative rotate is the counter-clockwise turn the CLI and the Wasm package take"
    req:
      /images:transform:
        post:
          headers:
            Authorization: "Bearer {{ vars.token }}"
            Content-Type: "application/json"
          body:
            application/json:
              source:
                kind: path
                path: /sample.png
              options:
                format: png
                rotate: -90
    test: |
      current.res.status == 200
      && current.res.headers['Content-Type'][0] == 'image/png'
